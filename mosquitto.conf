# mosquitto.conf - DÙNG CHO DEV/LOCAL TEST, KHÔNG dùng bản này cho production
listener 1883
allow_anonymous true

# --- Khi sẵn sàng bật auth thật (mosquitto-go-auth gọi về mqtt_auth_webhook) ---
# thì đổi thành:
# allow_anonymous false
# và thêm cấu hình plugin auth (xem tài liệu mosquitto-go-auth), ví dụ:
# auth_plugin /mosquitto/go-auth.so
# auth_opt_backends http
# auth_opt_http_host host.docker.internal
# auth_opt_http_port 8000
# auth_opt_http_getuser_uri /smartlock/api/mqtt/auth/