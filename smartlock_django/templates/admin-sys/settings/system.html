{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt Hệ thống - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">... (giữ navbar giống file 2)</nav>

    <div class="container-fluid py-4">
        <h4><i class="bi bi-gear"></i> Cài đặt Hệ thống</h4>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Token xác thực email (phút)</label>
                        <input type="number" name="verification_token_expiry_minutes" class="form-control" value="{{ system_settings.verification_token_expiry_minutes }}">
                    </div>
                    <div class="mb-3">
                        <label>Thời hạn mã chia sẻ (phút)</label>
                        <input type="number" name="share_code_expiry_minutes" class="form-control" value="{{ system_settings.share_code_expiry_minutes }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Lockout stages (phút)</label>
                        <input type="text" name="lockout_stages" class="form-control" value="{{ stages_text }}">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
