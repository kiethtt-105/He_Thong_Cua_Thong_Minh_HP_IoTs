{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lock Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0d6efd; }
        .sidebar { min-height: 100vh; background: #f8f9fa; position: fixed; width: 260px; transition: all 0.3s; }
        .main-content { margin-left: 260px; }
        .card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(13, 110, 253, 0.25);
        }
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background: #e9ecef;
            transform: translateX(8px);
        }
        .stat-card {
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-3">
            <div class="d-flex align-items-center mb-5">
                <i class="fa-solid fa-lock fs-2 text-primary"></i>
                <span class="ms-3 fw-bold fs-4">Smart Lock</span>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="{% url 'smartlock:dashboard' %}" class="nav-link text-dark fw-bold active"><i class="fa-solid fa-gauge me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:devices-list' %}" class="nav-link"><i class="fa-solid fa-plug me-2"></i> Thiết bị</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:nfc-tags' %}" class="nav-link"><i class="fa-solid fa-id-card me-2"></i> Thẻ NFC</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:share-codes' %}" class="nav-link"><i class="fa-solid fa-share-alt me-2"></i> Mã chia sẻ</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:support-requests' %}" class="nav-link"><i class="fa-solid fa-headset me-2"></i> Hỗ trợ</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:audit-logs' %}" class="nav-link"><i class="fa-solid fa-file-lines me-2"></i> Nhật ký</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:permissions-manage' %}" class="nav-link"><i class="fa-solid fa-shield-halved me-2"></i> Quyền hạn</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:settings-system' %}" class="nav-link"><i class="fa-solid fa-cog me-2"></i> Cài đặt</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:notifications' %}" class="nav-link"><i class="fa-solid fa-bell me-2"></i> Thông báo</a></li>
                <li class="nav-item"><a href="{% url 'smartlock:profile' %}" class="nav-link"><i class="fa-solid fa-user me-2"></i> Tài khoản</a></li>
            </ul>
            <div class="mt-5 pt-4 border-top">
                <a href="{% url 'smartlock:logout' %}" class="btn btn-outline-danger w-100"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
