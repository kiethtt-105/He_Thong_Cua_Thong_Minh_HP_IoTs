{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-body p-5">
                        <i class="fa-solid fa-envelope fa-4x text-primary mb-4"></i>
                        <h3>Xác thực tài khoản</h3>
                        <p class="lead">Chúng tôi đã gửi email xác thực đến <strong>{{ email }}</strong>.</p>
                        <p>Click vào link trong email để kích hoạt tài khoản.</p>
                        <a href="{{ verification_link }}" class="btn btn-primary btn-lg">Mở email</a>
                        <p class="mt-4 small">Nếu không thấy email, kiểm tra thư mục Spam.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
