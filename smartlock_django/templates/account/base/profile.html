{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>.card { border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }</style>
</head>
<body class="bg-light">
    <div class="container">
        <h4 class="mb-4">Thông tin cá nhân</h4>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr><td><strong>Email</strong></td><td>{{ user.email }}</td></tr>
                            <tr><td><strong>Tên đăng nhập</strong></td><td>{{ user.username }}</td></tr>
                            <tr><td><strong>Họ tên</strong></td><td>{{ user.full_name|default:"Chưa cập nhật" }}</td></tr>
                            <tr><td><strong>Số điện thoại</strong></td><td>{{ user.phone|default:"Chưa có" }}</td></tr>
                        </table>
                        <a href="{% url 'smartlock:password_reset' %}" class="btn btn-outline-primary">Đổi mật khẩu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
