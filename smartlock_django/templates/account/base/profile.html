{% load static %}
{% extends 'account/base/dashboard.html' %}
{% block content %}
<div class="container">
    <h4 class="mb-4">Thông tin cá nhân</h4>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr><td><strong>Email</strong></td><td>{{ user.email }}</td></tr>
                        <tr><td><strong>Tên đăng nhập</strong></td><td>{{ user.username }}</td></tr>
                        <tr><td><strong>Họ tên</strong></td><td>{{ user.full_name or "Chưa cập nhật" }}</td></tr>
                        <tr><td><strong>Số điện thoại</strong></td><td>{{ user.phone or "Chưa có" }}</td></tr>
                    </table>
                    <a href="{% url 'smartlock:password_reset' %}" class="btn btn-outline-primary">Đổi mật khẩu</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
