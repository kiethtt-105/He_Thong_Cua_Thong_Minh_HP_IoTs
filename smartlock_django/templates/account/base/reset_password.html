{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>.card { border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }</style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4">Đặt lại mật khẩu</h3>
                        {% if messages %}
                            {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
                        {% endif %}
                        {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="input-group mb-3"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span><input type="password" name="new_password1" class="form-control" placeholder="Mật khẩu mới" required></div>
                            <div class="input-group mb-4"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span><input type="password" name="new_password2" class="form-control" placeholder="Xác nhận" required></div>
                            <button type="submit" class="btn btn-primary w-100 mt-4">Cập nhật mật khẩu</button>
                        </form>
                        {% } else %}
                        <p class="text-muted text-center">Nhập email để nhận link đặt lại mật khẩu.</p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="input-group mb-4"><span class="input-group-text"><i class="fa-solid fa-envelope"></i></span><input type="email" name="email" class="form-control" placeholder="Email" required></div>
                            <button type="submit" class="btn btn-primary w-100">Gửi link đặt lại</button>
                        </form>
                        <div class="text-center mt-3"><a href="{% url 'smartlock:login' %}" class="text-decoration-none">Quay lại đăng nhập</a></div>
                        {% } endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
