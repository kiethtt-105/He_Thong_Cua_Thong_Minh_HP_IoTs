{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h3>Đặt lại mật khẩu</h3>
                        {% if messages %}
                            {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <input type="password" name="new_password1" class="form-control mb-3" placeholder="Mật khẩu mới" required>
                            <input type="password" name="new_password2" class="form-control" placeholder="Xác nhận" required>
                            <button type="submit" class="btn btn-primary w-100 mt-4">Cập nhật mật khẩu</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
