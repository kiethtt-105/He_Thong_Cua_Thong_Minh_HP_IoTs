{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Smart Lock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --neon: #c026d3;
      --neon-pink: #ec4899;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0f1c, #1e1e3f, #2a1f3f);
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .neon-shadow {
      text-shadow: 0 0 15px #c026d3,
                   0 0 30px #ec4899;
    }
    
    .input-focus:focus {
      box-shadow: 0 0 0 4px rgba(192, 38, 211, 0.35);
      border-color: #c026d3;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl border border-white/10">
    
    <div class="text-center mb-8">
      <div class="mx-auto w-24 h-24 flex items-center justify-center rounded-3xl mb-6 bg-gradient-to-br from-[#c026d3] to-[#ec4899]">
        <i class="fa-solid fa-lock text-6xl text-white"></i>
      </div>
      <h1 class="text-4xl font-bold text-white neon-shadow">Smart Lock</h1>
      <p class="text-[#cbd5e1] mt-3 text-lg">Bảo vệ khóa thông minh của bạn</p>
    </div>

    <form id="login-form" class="space-y-6">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      
      <div>
        <input type="text" name="identifier" placeholder="Email hoặc tên đăng nhập" 
               class="w-full glass px-6 py-4 rounded-2xl input-focus text-lg text-white placeholder:text-white/60"
               required autofocus autocomplete="username">
      </div>
      <div>
        <input type="password" name="password" placeholder="Mật khẩu" 
               class="w-full glass px-6 py-4 rounded-2xl input-focus text-lg text-white placeholder:text-white/60"
               required autocomplete="current-password">
      </div>

      <button type="submit" 
              class="w-full py-4 bg-gradient-to-r from-[#c026d3] to-[#ec4899] text-white font-semibold rounded-2xl hover:scale-105 transition-all text-lg shadow-[0_0_25px_rgba(192,38,211,0.5)]">
        Đăng nhập
      </button>
    </form>

    <div class="flex justify-between mt-8 text-sm">
      <a href="{% url 'smartlock:password_reset' %}" class="text-[#c026d3] hover:underline">Quên mật khẩu?</a>
      <a href="{% url 'smartlock:register' %}" class="text-[#c026d3] hover:underline">Đăng ký</a>
    </div>
  </div>

  <script>
    document.body.style.opacity = '0';
    setTimeout(() => {
      document.body.style.transition = 'opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1)';
      document.body.style.opacity = '1';
    }, 50);
  </script>
</body>
</html>
