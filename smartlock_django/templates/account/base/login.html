{% extends 'account/base/layout.html' %}
{% block title %}Đăng nhập{% endblock %}
{% block shell %}
<div class="auth-bg"><div class="container py-4">
    <div class="card auth-card mx-auto"><div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3"><i class="fa-solid fa-lock"></i></div>
            <h3 class="fw-bold mb-1">Smart Lock</h3>
            <p class="text-muted mb-0">Đăng nhập để tiếp tục</p>
        </div>
        {% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>{% endfor %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="identifier" class="form-control" placeholder="Email hoặc tên đăng nhập" required autofocus autocomplete="username">
            </div>
            <div class="input-group mb-4">
                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Đăng nhập</button>
        </form>
        <div class="text-center mt-4 small">
            <a href="{% url 'smartlock:password_reset' %}" class="text-decoration-none">Quên mật khẩu?</a>
            <span class="text-muted mx-1">•</span>
            <a href="{% url 'smartlock:register' %}" class="text-decoration-none">Đăng ký tài khoản</a>
        </div>
    </div></div>
</div></div>
{% endblock %}
