{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Smart Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #6610f2); }
        .card { border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card text-center">
                    <div class="card-body p-5">
                        <i class="fa-solid fa-user fa-5x text-primary mb-4"></i>
                        <h2 class="fw-bold mb-2">Smart Lock</h2>
                        <p class="text-muted">Tạo tài khoản mới</p>
                        
                        {% if messages %}
                            {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="Họ và tên">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" name="password1" class="form-control" placeholder="Mật khẩu" required>
                            </div>
                            <div class="input-group mb-4">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" name="password2" class="form-control" placeholder="Xác nhận mật khẩu" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">Đăng ký</button>
                        </form>

                        <div class="mt-4">
                            <a href="{% url 'smartlock:login' %}" class="text-decoration-none">Đã có tài khoản? Đăng nhập ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
