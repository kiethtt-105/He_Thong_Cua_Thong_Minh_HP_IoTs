{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>.card { border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }</style>
</head>
<body class="bg-light">
    <div class="container">
        <h4>Cài đặt hệ thống</h4>
        <form method="post">
            {% csrf_token %}
            <div class="card shadow">
                <div class="card-body">
                    <!-- Form SystemSettings sẽ được thêm sau -->
                    <p class="text-muted">Form cài đặt hệ thống sẽ được thêm sau.</p>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
