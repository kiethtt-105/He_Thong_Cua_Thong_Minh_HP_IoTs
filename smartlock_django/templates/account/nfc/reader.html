{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý quyền hạn thiết bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #6610f2); }
        .card { border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .card:hover { transform: translateY(-12px); box-shadow: 0 20px 50px rgba(13, 110, 253, 0.3); }
        .nav-link { transition: all 0.3s; }
        .nav-link:hover { background: #f8f9fa; transform: translateX(10px); }
        .table th { cursor: pointer; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h4 class="mb-4">Quản lý quyền hạn thiết bị</h4>
        
        <div class="row g-4">
            <!-- Chọn thiết bị -->
            <div class="col-lg-6">
                <div class="card shadow">
                    <div class="card-header">
                        <h5 class="mb-0">Chọn thiết bị</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-plug"></i></span>
                            <select class="form-select" id="deviceSelect">
                                <option value="">-- Chọn thiết bị --</option>
                                {% for d in device_list %}
                                <option value="{{ d.id }}">{{ d.name }} ({{ d.status }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chọn người dùng -->
            <div class="col-lg-6">
                <div class="card shadow">
                    <div class="card-header">
                        <h5 class="mb-0">Chọn người dùng</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="userSearch" placeholder="Tìm tên hoặc email...">
                        </div>
                        <div class="user-list" id="userList" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quyền hạn -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Quyền hạn cho thiết bị <span id="selectedDeviceName" class="text-primary"></span></h5>
                        <button class="btn btn-success" onclick="savePermissions()">
                            <i class="fa-solid fa-save me-2"></i> Lưu quyền hạn
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="permAll" onchange="toggleAllPermissions()">
                            <label class="form-check-label fw-bold" for="permAll">Chọn tất cả quyền hạn</label>
                        </div>

                        <div class="row g-3" id="permissionList">
                            <!-- Quyền sẽ được populate bằng JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lấy dữ liệu từ database
        const defaultPermissions = [
            {code:"UNLOCK", name:"Mở khóa", description:"Mở khóa từ xa"},
            {code:"LOCK", name:"Khóa", description:"Khóa từ xa"},
            {code:"ADD_CARD", name:"Thêm thẻ NFC", description:"Thêm thẻ NFC"},
            {code:"REMOVE_CARD", name:"Xóa thẻ NFC", description:"Xóa thẻ NFC"},
            {code:"RESET", name:"Reset", description:"Reset thiết bị"},
            {code:"OTA_UPDATE", name:"OTA Update", description:"Cập nhật firmware"}
        ];
        const permissionsElement = document.getElementById("permissions-data");
        const allPermissions = permissionsElement
            ? JSON.parse(permissionsElement.textContent)
            : defaultPermissions;

        function populatePermissionList() {
            const container = document.getElementById("permissionList");
            container.innerHTML = "";
            allPermissions.forEach(perm => {
                const div = document.createElement("div");
                div.className = "col-md-6 col-lg-4";
                div.innerHTML = `
                    <div class="form-check form-switch">
                        <input class="form-check-input perm-check" type="checkbox" onchange="updateSelectedPermissions('${perm.code}')" id="perm-${perm.code}">
                        <label class="form-check-label" for="perm-${perm.code}">
                            <strong>${perm.name}</strong><br>
                            <small class="text-muted">${perm.description}</small>
                        </label>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateSelectedPermissions(code) {
            console.log("Selected:", code);
        }

        function toggleAllPermissions() {
            const checkboxes = document.querySelectorAll(".perm-check");
            const checked = document.getElementById("permAll").checked;
            checkboxes.forEach(cb => cb.checked = checked);
        }

        function savePermissions() {
            const deviceId = document.getElementById("deviceSelect").value;
            if (!deviceId) {
                alert("Vui lòng chọn thiết bị!");
                return;
            }
            alert(`Đã lưu quyền hạn cho thiết bị ID: ${deviceId}\n(Sẽ được gửi lên API sau)`);
            console.log("Permissions saved:", { device: deviceId, user: selectedUser, perms: selectedPermissions });
        }

        // Demo data + search
        let selectedUser = null;
        const demoUsers = [
            {id: "u1", name: "Nguyễn Văn A", email: "a@example.com"},
            {id: "u2", name: "Trần Thị B", email: "b@example.com"}
        ];

        window.onload = () => {
            populatePermissionList();
            
            // Search user
            document.getElementById("userSearch").addEventListener("input", function() {
                const term = this.value.toLowerCase();
                const list = document.getElementById("userList");
                list.innerHTML = "";
                const filtered = demoUsers.filter(u => u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term));
                filtered.forEach(u => {
                    const div = document.createElement("div");
                    div.className = "p-3 border-bottom hover:bg-light cursor-pointer";
                    div.innerHTML = `<strong>${u.name}</strong><br><small>${u.email}</small>`;
                    div.onclick = () => {
                        selectedUser = u;
                        list.innerHTML = `<div class="p-3 bg-success text-white text-center rounded">Đã chọn: ${u.name}</div>`;
                    };
                    list.appendChild(div);
                });
            });
        };
    </script>
</body>
</html>
