{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thẻ NFC của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>.card { border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }</style>
</head>
<body class="bg-light">
    <div class="container">
        <h4 class="mb-4">Thẻ NFC của tôi</h4>
        <table class="table table-hover table-striped">
            <thead class="table-light">
                <tr>
                    <th>Tên thẻ</th>
                    <th>UID</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>
            <tbody>
                {% for card in access_cards %}
                <tr>
                    <td>{{ card.name|default:"Chưa đặt tên" }}</td>
                    <td><code>{{ card.card_uid_hash|slice:":8" }}...</code></td>
                    <td>
                        {% if card.is_active %}
                            <span class="badge bg-success">Đang hoạt động</span>
                        {% else %}
                            <span class="badge bg-secondary">Vô hiệu hóa</span>
                        {% } endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
