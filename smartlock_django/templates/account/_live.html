{# Bộ máy vẽ giao diện từ SmartlockCache (API snapshot). Mỗi trang gọi Live.mount({...}). #}
<script>
window.Live = (function () {
    const ZERO = '00000000-0000-0000-0000-000000000000';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    function dt(iso, sec) {
        if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return '';
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + (sec ? ':' + pad(d.getSeconds()) : '');
    }
    function dshort(iso) { const s = dt(iso); return s ? s.slice(0, 5) + ' ' + s.slice(11) : ''; }
    function dday(iso) { return dt(iso).slice(0, 10); }
    function ago(iso) {
        if (!iso) return ''; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
        if (s < 60) return 'vài giây'; const m = Math.floor(s / 60); if (m < 60) return m + ' phút';
        const h = Math.floor(m / 60); if (h < 24) return h + ' giờ'; return Math.floor(h / 24) + ' ngày';
    }
    const url = (tpl, id) => tpl.replace(ZERO, id);
    const qp = n => new URLSearchParams(location.search).get(n);
    const sevCls = s => s === 'critical' ? 'danger' : s === 'warning' ? 'warning' : 'info';
    const statusCls = st => st === 'online' ? 'ok' : st === 'maintenance' ? 'warn' : st === 'revoked' ? 'bad' : st === 'provisioning' ? 'info' : '';
    const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    const initial = s => esc((s || '?').charAt(0).toUpperCase());
    const battCls = n => n < 20 ? 'bg-danger' : n < 50 ? 'bg-warning' : 'bg-success';
    const empty = (icon, title, sub) => '<div class="empty-state"><div class="ei"><i class="fa-solid ' + icon + '"></i></div>' + (title ? '<h6>' + title + '</h6>' : '') + (sub ? '<div>' + sub + '</div>' : '') + '</div>';
    const spin = '<div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm me-2"></div>Đang tải…</div>';
    const can = (d, code) => !!d && (d.is_owner || (d.permissions || []).indexOf(code) !== -1);
    const caps = d => d ? {
        is_owner: d.is_owner,
        remote_lock: can(d, 'LOCK') && d.wifi_enabled, remote_unlock: can(d, 'UNLOCK') && d.wifi_enabled,
        manage_nfc: can(d, 'manage_nfc'), manage_pins: can(d, 'manage_pins'), manage_faces: can(d, 'manage_face_profiles'),
        view_history: can(d, 'view_history'), manage_sharing: d.is_owner
    } : {};
    function lockInfo(st) {
        return st === 'locked' ? { cls: 'text-success', ico: 'fa-lock', txt: 'Đã khóa', k: 'locked' }
            : st === 'unlocked' ? { cls: 'text-danger', ico: 'fa-lock-open', txt: 'Đang mở', k: 'unlocked' }
            : st === 'jammed' ? { cls: 'text-warning', ico: 'fa-triangle-exclamation', txt: 'Bị kẹt', k: 'jammed' }
            : { cls: 'text-secondary', ico: 'fa-circle-question', txt: 'Không rõ', k: 'unknown' };
    }

    /* Không vẽ đè vùng người dùng đang thao tác: ô nhập đang focus / đã sửa dở, menu mở rộng, hộp thoại đang mở. */
    function busy(el) {
        if (el.querySelector('.collapse.show, .collapsing, .modal.show')) return true;
        const a = document.activeElement;
        if (a && el.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
        const fields = el.querySelectorAll('input,textarea,select');
        for (let i = 0; i < fields.length; i++) {
            const f = fields[i];
            if (f.hasAttribute('data-live-ignore')) continue;
            if (f.type === 'checkbox' || f.type === 'radio') { if (f.checked !== f.defaultChecked) return true; }
            else if (f.type !== 'hidden' && f.value !== f.defaultValue) return true;
        }
        return false;
    }

    /* Danh sách thiết bị trong <select>: chỉ dựng lại khi danh sách đổi, giữ nguyên lựa chọn hiện tại. */
    function fillSelect(sel, items, selectedId, allLabel) {
        if (!sel) return;
        const html = (allLabel != null ? '<option value="">' + esc(allLabel) + '</option>' : '') +
            items.map(d => '<option value="' + esc(d.id) + '">' + esc(d.name) + '</option>').join('') ||
            '<option value="">Chưa có thiết bị</option>';
        if (sel._h !== html) { sel.innerHTML = html; sel._h = html; }
        sel.value = selectedId || '';
        if (sel.value !== (selectedId || '') && sel.options.length) sel.selectedIndex = 0;
    }
    function pickDevice(items, wanted) {
        return items.find(d => d.id === wanted) || items[0] || null;
    }

    /* cfg: { ctx(bundle) -> object, regions: { elementId: (bundle, ctx) => html }, after(bundle, ctx) } */
    function mount(cfg) {
        let pending = false, ctx = {};
        function run() {
            const b = window.SmartlockCache && SmartlockCache.get();
            if (!b) return;
            ctx = cfg.ctx ? cfg.ctx(b) : {};
            if (cfg.before) cfg.before(b, ctx);
            Object.keys(cfg.regions || {}).forEach(id => {
                const el = document.getElementById(id); if (!el) return;
                let html;
                try { html = cfg.regions[id](b, ctx); } catch (e) { console.error('render', id, e); return; }
                if (html === el._h) return;
                if (busy(el)) { pending = true; return; }
                el.innerHTML = html; el._h = html;
            });
            if (cfg.after) cfg.after(b, ctx);
        }
        document.addEventListener('smartlock:cache-updated', run);
        setInterval(() => { if (pending) { pending = false; run(); } }, 1000);
        run();
        return run;
    }
    return { ZERO, esc, dt, dshort, dday, ago, url, qp, sevCls, statusCls, cap, initial, battCls, empty, spin, can, caps, lockInfo,
             fillSelect, pickDevice, mount };
})();
</script>
