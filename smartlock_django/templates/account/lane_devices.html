{# LANE devices: tổng quan, danh sách + chi tiết khóa, điều khiển, PIN, khuôn mặt (camera), NFC, kênh kết nối #}
<script>
Object.assign(V,{
home(){const D=S.devices||[],a=S.activity||{labels:[],values:[]},mx=Math.max(1,...a.values),u=S.user;
 const ann=(S.announcements||[]).filter(x=>!(localStorage.sl_dis||'').includes(x.id)).map(x=>`<div class="card" style="margin-bottom:14px;border-left:4px solid var(--${x.level==='critical'?'bad':x.level==='warning'?'warn':'a'})"><div class="row" style="border:0;padding:0"><div class="f"><b>${esc(x.title)}</b><div class="sm mut">${esc(x.body)}</div></div><button class="btn g s" data-a="dis" data-id="${x.id}">Ẩn</button></div></div>`).join('');
 return shell(`${ann}<div class="grid g4" style="margin-bottom:14px"><div class="card stat"><b>${D.length}</b><span>Thiết bị</span></div><div class="card stat"><b style="color:var(--ok)">${D.filter(d=>d.status==='online').length}</b><span>Đang online</span></div><div class="card stat"><b>${S.unread_count||0}</b><span>Chưa đọc</span></div><div class="card stat"><b>${a.values.reduce((x,y)=>x+y,0)}</b><span>Hoạt động 7 ngày</span></div></div>
 <div class="grid g2" style="margin-bottom:14px">${D.map(devCard).join('')||`<div class="card empty">Chưa có khóa nào.<br><br><a data-l class="btn" href="/devices/claim/">+ Thêm khóa</a></div>`}</div>
 <div class="grid g2"><div class="card"><h2>Hoạt động 7 ngày</h2><div class="bars" style="margin-bottom:26px">${a.values.map((v,i)=>`<i style="height:${Math.max(4,v/mx*100)}%" title="${v}"><em>${a.labels[i]}</em></i>`).join('')}</div></div>
 <div class="card"><h2>Ra vào gần đây</h2>${(S.history||[]).slice(0,5).map(evRow).join('')||none('Chưa có sự kiện.')}</div></div>`,`Xin chào, ${esc(u.full_name||u.username)} 👋`,`<a data-l class="btn" href="/devices/claim/">+ Thêm khóa</a>`)},
devices(){return shell(`<div class="grid g2">${(S.devices||[]).map(devCard).join('')||none('Chưa có khóa nào.')}</div>`,'Khóa của tôi',`<button class="btn" data-a="claim">+ Thêm khóa</button>`)},
device(){const d=dev(ROUTE.id);if(!d)return shell(none('Không tìm thấy thiết bị.'),'Thiết bị');const id=d.id,P=d.permissions,own=d.is_owner;
 const T=[['control','Điều khiển'],['pins','Mã PIN'],['face','Khuôn mặt'],['nfc','NFC'],['shares','Chia sẻ'],['hist','Lịch sử'],['set','Cài đặt']].filter(t=>own||t[0]==='control'||t[0]==='hist'||(t[0]==='pins'&&P.includes('manage_pins'))||(t[0]==='face'&&P.includes('manage_face_profiles'))||(t[0]==='nfc'&&P.includes('manage_nfc')));
 let b='';const l=LIVE_DATA&&LIVE_DATA.id===id?LIVE_DATA:{};
 if(TAB==='control')b=`<div class="grid g2"><div class="card" style="text-align:center"><div class="lock ${l.lock_state||d.lock_state}" style="margin:0 auto 12px;width:96px;height:96px;border-radius:30px">${ic((l.lock_state||d.lock_state)==='unlocked'?'open':'lock',44)}</div><h2>${lockTxt[l.lock_state||d.lock_state]||'Chưa rõ'}</h2><div class="mut sm" style="margin-bottom:14px">${l.connected===false?'Mất kết nối':'Đang kết nối'} · Pin ${l.battery??d.battery_level??'—'}% ${l.tamper?'· <b style="color:var(--bad)">Cảnh báo phá khóa!</b>':''}${l.locked_out?' · <b style="color:var(--warn)">Đang khóa tạm</b>':''}</div>${lockBtns(d)}${own?` <button class="btn g s" data-a="cmd" data-id="${id}" data-c="REBOOT">Khởi động lại</button>`:''}</div>
 <div class="card"><h2>Lệnh gần đây</h2>${(S.commands||[]).filter(c=>c.device_id===id).slice(0,6).map(c=>`<div class="row"><b>${esc(c.command)}</b><span class="f mut sm">${esc(c.by||'')} · ${ago(c.created_at)}</span><span class="pill ${c.status==='acknowledged'?'ok':c.status==='pending'||c.status==='sent'?'warn':'bad'}">${esc(c.status)}</span></div>`).join('')||none('Chưa có lệnh.')}</div></div>`;
 if(TAB==='pins'){const L=(S.pins||[]).filter(p=>p.device_id===id);b=`<div class="card"><div class="top" style="margin:0 0 6px"><h2>Mã PIN cho khách</h2><button class="btn s" data-a="pinNew" data-id="${id}">+ Tạo mã</button></div>${L.map(p=>`<div class="row"><div class="f"><b>${esc(p.label||'Mã khách')}</b><div class="sm mut">Dùng ${p.use_count}/${p.max_uses||'∞'} · hết hạn ${fdt(p.expires_at)}</div></div><span class="pill ${p.is_valid_now?'ok':'bad'}">${p.is_valid_now?'Hiệu lực':'Hết hiệu lực'}</span><button class="btn g s" data-a="pinEdit" data-id="${p.id}">Sửa</button><button class="btn d s" data-a="del" data-u="pins/${p.id}/" data-t="Thu hồi mã PIN này?">Thu hồi</button></div>`).join('')||none('Chưa có mã PIN.')}</div>`}
 if(TAB==='shares'){const L=(S.shares_out||[]).filter(p=>p.device_id===id);b=`<div class="card"><div class="top" style="margin:0 0 6px"><h2>Người được chia sẻ</h2><button class="btn s" data-a="shareNew" data-id="${id}">+ Chia sẻ</button></div>${L.map(s=>`<div class="row"><div class="f"><b>${esc(s.user.full_name||s.user.username)}</b><div class="sm mut">${s.permissions.length} quyền · hết hạn ${fdt(s.expires_at)}</div></div><button class="btn g s" data-a="shareEdit" data-id="${s.id}" data-dev="${id}">Sửa quyền</button><button class="btn d s" data-a="del" data-u="shares/${s.id}/" data-t="Thu hồi quyền truy cập?">Thu hồi</button></div>`).join('')||none('Chưa chia sẻ cho ai.')}</div>`}
 if(TAB==='hist')b=`<div class="card">${(S.history||[]).filter(e=>e.device_id===id).map(evRow).join('')||none('Chưa có sự kiện.')}</div>`;
 if(TAB==='face'){const L=(S.faces||[]).filter(f=>f.device_id===id);b=`<div class="card"><div class="top" style="margin:0 0 6px"><h2>Hồ sơ khuôn mặt</h2><button class="btn s" data-a="faceNew" data-id="${id}">📷 Quét khuôn mặt</button></div>${L.map(f=>`<div class="row"><div class="f"><b>${esc(f.name||f.user)}</b><div class="sm mut">${esc(f.user)} · ${ago(f.created_at)}</div></div><span class="pill ${f.is_active?'ok':''}">${f.is_active?'Đang bật':'Tắt'}</span>${own?`<button class="btn g s" data-a="faceTog" data-id="${f.id}" data-v="${f.is_active?0:1}">${f.is_active?'Tắt':'Bật'}</button>`:''}<button class="btn d s" data-a="del" data-u="faces/${f.id}/" data-t="Xóa vĩnh viễn dữ liệu khuôn mặt này?">Xóa</button></div>`).join('')||none('Chưa có khuôn mặt nào.')}<p class="sm mut" style="margin-bottom:0">Ảnh chỉ xử lý trên thiết bị của bạn, server chỉ lưu vector đặc trưng đã mã hóa.</p></div>`}
 if(TAB==='nfc'){const R=(S.nfc_readers||[]).filter(r=>r.device_id===id),C=(S.cards||[]).filter(c=>c.devices.some(x=>x.device_id===id)),NL=(S.nfc_logs||[]).filter(x=>x.device_id===id).slice(0,8);
  b=`<div class="grid g2"><div class="card"><div class="top" style="margin:0 0 6px"><h2>Đầu đọc NFC</h2>${own&&d.nfc_enabled?`<button class="btn s" data-a="readerNew" data-id="${id}">+ Thêm</button>`:''}</div>${d.nfc_enabled?'':'<div class="err">NFC của khóa đang tắt (bật trong Cài đặt).</div>'}${R.map(r=>`<div class="row"><div class="f"><b>${esc(r.name||'Đầu đọc')}</b><div class="sm mut">${esc(r.reader_mode)} · ${ago(r.last_seen_at)}${r.auto_register?` · đang chờ quét thẻ mới (${r.auto_register_seconds_left}s)`:''}</div></div>${own?`<button class="btn g s" data-a="readerAuto" data-id="${r.id}" data-v="${r.auto_register?0:1}">${r.auto_register?'Dừng đăng ký':'Đăng ký thẻ'}</button><button class="btn g s" data-a="readerTog" data-id="${r.id}" data-v="${r.is_active?0:1}">${r.is_active?'Tắt':'Bật'}</button>`:''}</div>`).join('')||none('Chưa có đầu đọc.')}</div>
  <div class="card"><h2>Thẻ đã gán</h2>${C.map(c=>`<div class="row"><b class="f">${esc(c.name||'Thẻ NFC')}</b><span class="pill ${c.is_active?'ok':''}">${c.is_active?'Bật':'Tắt'}</span></div>`).join('')||none('Chưa có thẻ.')}<h2 style="margin-top:16px">Nhật ký NFC</h2>${NL.map(x=>`<div class="row"><span class="pill ${x.success?'ok':'bad'}">${x.success?'OK':'Lỗi'}</span><div class="f sm">${esc(x.event_type)} ${esc(x.card)}</div><span class="mut sm">${ago(x.created_at)}</span></div>`).join('')||none('Trống.')}</div></div>`}
 if(TAB==='set'){const sw=(k,t,i)=>`<div class="row"><div class="f">${t}</div><button class="btn ${d[k]?'':'g'} s" data-a="flag" data-id="${id}" data-k="${k}" data-v="${d[k]?0:1}">${d[k]?'Đang bật':'Đang tắt'}</button></div>`;
 b=`<div class="grid g2"><form class="card" data-f="devEdit" data-id="${id}"><h2>Thông tin</h2><label>Tên</label><input name="name" value="${esc(d.name)}" required><label>Vị trí</label><input name="location" value="${esc(d.location)}"><button class="btn">Lưu</button><div class="sm mut" style="margin-top:12px">Mã: ${esc(d.device_code)} · FW ${esc(d.firmware_version||'—')} · MAC ${esc(d.mac_address||'—')}</div></form>
 <div class="card"><h2>Kênh kết nối</h2>${sw('wifi_enabled','Wi-Fi (điều khiển từ xa)')}${sw('bluetooth_enabled','Bluetooth')}${sw('nfc_enabled','NFC')}<h2 style="margin-top:16px">Bảo mật khóa</h2><div class="row"><div class="f">Gỡ khóa tạm (nhập sai nhiều lần)</div><button class="btn g s" data-a="clearLock" data-id="${id}">Gỡ</button></div><div class="row"><div class="f">Xoay secret thiết bị</div><button class="btn g s" data-a="rotate" data-id="${id}">Xoay</button></div><div class="row"><div class="f">Gỡ khóa khỏi tài khoản</div><button class="btn d s" data-a="delDev" data-id="${id}">Gỡ</button></div></div></div>`}
 return shell(`<div class="tabs">${T.map(([k,t])=>`<a data-a="tab" data-k="${k}" class="${TAB===k?'on':''}">${t}</a>`).join('')}</div>${b}`,esc(d.name),`<span class="pill ${d.status==='online'?'ok':'bad'}">${d.status==='online'?'Online':'Offline'}</span>`)},
});
let LIVE_DATA=null;
function startLive(){const tick=async()=>{if(ROUTE.page!=='device'||document.hidden)return;const r=await api('GET',`devices/${ROUTE.id}/live/`);if(r.ok){const was=JSON.stringify(LIVE_DATA);LIVE_DATA={...r.d,id:ROUTE.id};if(was!==JSON.stringify(LIVE_DATA)&&TAB==='control'&&!document.querySelector('.modal'))render()}};tick();LIVE=setInterval(tick,2500)}
const claimModal=()=>mform('Thêm khóa mới',`<label>Mã thiết bị</label><input name="device_code" required><label>Secret</label><input name="secret" required>`,'claim');
const loc=t=>{const d=new Date(t);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
async function shareModal(devId,sh){if(!CAT){const r=await api('GET','permissions/');CAT=r.ok?r.d:{}}const rp=CAT.role_presets||[],cur=sh?sh.permissions:[];
 mform(sh?'Sửa quyền chia sẻ':'Chia sẻ khóa',(sh?`<p class="mut">${esc(sh.user.username)}</p>`:`<label>Email hoặc username</label><input name="identifier" required>`)+`<label>Vai trò mẫu</label><select name="preset"><option value="">Tự chọn từng quyền bên dưới</option>${rp.map(p=>`<option value="${esc(p.key)}">${esc(p.name||p.label||p.key)}</option>`).join('')}</select>`+(CAT.groups||[]).map(g=>`<div class="sm" style="margin:10px 0 4px"><b>${esc(g.name)}</b></div>`+g.items.map(i=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);margin:3px 0"><input type="checkbox" name="perm" value="${esc(i.code)}" ${cur.includes(i.code)?'checked':''} style="width:auto;margin:0"> ${esc(i.name)}${i.sensitive?' ⚠️':''}</label>`).join('')).join('')+`<label style="display:block;margin-top:12px">Hết hạn (bỏ trống = không giới hạn)</label><input name="expires_at" type="datetime-local" value="${sh&&sh.expires_at?loc(sh.expires_at):''}">`,'share',devId+'|'+(sh?sh.id:''))}
let FAPI=null;const FU='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/';
const loadFace=()=>FAPI||(FAPI=new Promise((ok,no)=>{const x=document.createElement('script');x.src=FU+'dist/face-api.js';x.onload=async()=>{try{await Promise.all(['tinyFaceDetector','faceLandmark68Net','faceRecognitionNet'].map(n=>faceapi.nets[n].loadFromUri(FU+'model/')));ok()}catch(e){FAPI=null;no(e)}};x.onerror=()=>{FAPI=null;no(new Error('Không tải được thư viện nhận diện (kiểm tra mạng).'))};document.head.append(x)}));
Object.assign(ACT,{
claim:claimModal,
async cmd(el){el.disabled=true;const r=await api('POST',`devices/${el.dataset.id}/commands/`,{command:el.dataset.c});if(!r.ok){toast(em(r),1);el.disabled=false;return}toast(r.d.message||'Đã gửi lệnh');let st=r.d.command.status;const id=r.d.command.id;
 for(let i=0;i<20&&!['acknowledged','failed','expired'].includes(st);i++){await new Promise(x=>setTimeout(x,1000));const q=await api('GET','commands/'+id+'/');if(q.ok)st=(q.d.command||q.d).status||st}
 toast(st==='acknowledged'?'Thiết bị đã thực hiện ✓':['failed','expired'].includes(st)?'Lệnh thất bại ('+st+')':'Thiết bị chưa phản hồi',st!=='acknowledged');el.disabled=false;await load(true);render()},
dis(el){localStorage.sl_dis=(localStorage.sl_dis||'')+el.dataset.id;render()},
pinNew(el){mform('Tạo mã PIN khách',`<label>Nhãn</label><input name="label" placeholder="VD: Thợ sửa điện"><label>Hiệu lực (phút)</label><input name="ttl_minutes" type="number" value="1440" min="1"><label>Số lần dùng (0 = không giới hạn)</label><input name="max_uses" type="number" value="1" min="0">`,'pin',el.dataset.id)},
shareNew(el){shareModal(el.dataset.id)},shareEdit(el){shareModal(el.dataset.dev,(S.shares_out||[]).find(x=>x.id===el.dataset.id))},
rotate(el){mform('Xoay secret',`<p class="mut sm">Nhập mật khẩu để xác nhận. Secret mới chỉ hiện một lần.</p><input name="password" type="password" required>`,'rotate',el.dataset.id)},
async clearLock(el){await after(await api('POST',`devices/${el.dataset.id}/clear-lockout/`),'Đã gỡ khóa tạm')},
faceNew(el){modal(`<form data-f="face" data-id="${el.dataset.id}"><h2>Đăng ký khuôn mặt</h2><div id="err"></div><label>Tên hiển thị</label><input name="name" placeholder="VD: Bố, Khách phòng 2"><label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink)"><input type="checkbox" name="consent" style="width:auto;margin:0"> Người được quét đã đồng ý thu thập dữ liệu khuôn mặt (NĐ 13/2023).</label><video id="fv" playsinline muted autoplay style="display:none;width:100%;border-radius:14px;margin:12px 0;transform:scaleX(-1)"></video><p id="fst" class="sm mut"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn g" data-a="close">Đóng</button><button class="btn">Bắt đầu quét</button></div></form>`)},
async faceTog(el){await after(await api('PATCH',`faces/${el.dataset.id}/`,{is_active:el.dataset.v==='1'}))},
readerNew(el){mform('Thêm đầu đọc NFC',`<label>Tên</label><input name="name" placeholder="Đầu đọc cửa chính">`,'reader',el.dataset.id)},
async readerTog(el){await after(await api('PATCH',`nfc-readers/${el.dataset.id}/`,{is_active:el.dataset.v==='1'}))},
async readerAuto(el){await after(await api('PATCH',`nfc-readers/${el.dataset.id}/`,{auto_register:el.dataset.v==='1'}),el.dataset.v==='1'?'Hãy quét thẻ mới trên đầu đọc (60 giây)':'Đã dừng')},
async flag(el){await after(await api('PATCH',`devices/${el.dataset.id}/`,{[el.dataset.k]:el.dataset.v==='1'}),'Đã cập nhật')},
delDev(el){const d=dev(el.dataset.id);mform('Gỡ khóa khỏi tài khoản',`<p class="mut sm">Mọi mã PIN, thẻ, khuôn mặt, chia sẻ của khóa sẽ bị thu hồi. Nhập lại mã khóa <b>${esc(d.device_code)}</b> để xác nhận.</p><input name="device_code" required>`,'delDev',d.id)},
pinEdit(el){const p=(S.pins||[]).find(x=>x.id===el.dataset.id);mform('Sửa mã PIN',`<label>Nhãn</label><input name="label" value="${esc(p.label)}"><label>Gia hạn thêm (phút, tính từ bây giờ; bỏ trống = giữ nguyên)</label><input name="ttl_minutes" type="number" min="1">`,'pinEdit',p.id)}
});
Object.assign(FORMS,{
async claim(b,e){await after(await api('POST','devices/claim/',b),'Đã thêm khóa',()=>go('/devices/',true))},
async devEdit(b,e,id){await after(await api('PATCH',`devices/${id}/`,b),'Đã lưu')},
async pin(b,e,id){const r=await api('POST',`devices/${id}/pins/`,{label:b.label,ttl_minutes:+b.ttl_minutes,max_uses:+b.max_uses});if(r.ok){await load(true);modal(`<h2>Mã PIN của khách</h2><div class="pin">${esc(r.d.plain_pin)}</div><p class="sm mut">${esc(r.d.message)} Mã chỉ hiển thị một lần.</p><button class="btn" data-a="close">Xong</button>`);render()}else e.innerHTML=`<div class="err">${esc(em(r))}</div>`},
async share(b,e,id,f){const [dv,sid]=id.split('|');const body={};if(b.identifier)body.identifier=b.identifier;if(b.preset)body.preset=b.preset;else body.permissions=[...f.querySelectorAll('[name=perm]:checked')].map(x=>x.value);if(b.expires_at)body.expires_at=new Date(b.expires_at).toISOString();else if(sid)body.expires_at=null;
 await after(sid?await api('PATCH',`shares/${sid}/`,body):await api('POST',`devices/${dv}/shares/`,body),'Đã lưu chia sẻ')},
async rotate(b,e,id){const r=await api('POST',`devices/${id}/rotate-secret/`,b);if(r.ok)modal(`<h2>Secret mới</h2><div class="pin" style="font-size:16px;letter-spacing:1px;word-break:break-all">${esc(r.d.secret)}</div><p class="sm mut">${esc(r.d.message)}</p><button class="btn" data-a="close">Đã lưu lại</button>`);else e.innerHTML=`<div class="err">${esc(em(r))}</div>`},
async reader(b,e,id){await after(await api('POST',`devices/${id}/nfc-readers/`,{name:b.name}),'Đã thêm đầu đọc')},
async delDev(b,e,id){const r=await api('DELETE',`devices/${id}/`,{device_code:b.device_code});if(await after(r,'Đã gỡ khóa'))go('/devices/',true)},
async pinEdit(b,e,id){const body={label:b.label};if(b.ttl_minutes)body.ttl_minutes=+b.ttl_minutes;await after(await api('PATCH',`pins/${id}/`,body),'Đã cập nhật mã PIN')},
async face(b,e,id){const st=$('#fst'),v=$('#fv'),say=t=>{if(st)st.textContent=t};if(!b.consent)return say('Hãy tích xác nhận đồng ý trước khi quét.');
 if(!navigator.mediaDevices?.getUserMedia)return say('Không mở được camera (cần HTTPS hoặc localhost; trong app WebView cần cấp quyền camera).');
 let stream;const NEED=S.meta?.face_min_frames||3;try{say('Đang tải mô hình nhận diện (lần đầu mất vài giây)…');await loadFace();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640}});v.srcObject=stream;v.style.display='block';await v.play();
  const opt=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.6}),vec=[],end=Date.now()+25000;say('Nhìn thẳng vào camera, giữ yên mặt…');
  while(vec.length<NEED&&Date.now()<end&&document.getElementById('fv')){const f=await faceapi.detectAllFaces(v,opt).withFaceLandmarks().withFaceDescriptors();
   if(f.length===1&&f[0].detection.box.width>=v.videoWidth*.25){vec.push(Array.from(f[0].descriptor));say(`Đã lấy ${vec.length}/${NEED} khung hình…`)}else say(f.length>1?'Chỉ để một người trong khung hình.':'Chưa thấy rõ mặt: lại gần camera, đủ sáng.');await new Promise(x=>setTimeout(x,400))}
  if(vec.length<NEED)return say('Không quét đủ khung hình, hãy thử lại.');say('Đang lưu…');
  await after(await api('POST',`devices/${id}/faces/`,{name:b.name,consent_confirmed:true,embeddings:vec}),'Đã đăng ký khuôn mặt')}
 catch(err){say(err.name==='NotAllowedError'?'Bạn chưa cho phép dùng camera.':'Lỗi khi quét: '+(err.message||err))}finally{stream&&stream.getTracks().forEach(t=>t.stop())}}
});
</script>
