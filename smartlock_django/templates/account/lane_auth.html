{# LANE auth: đăng nhập, 2FA (+passkey), đăng ký, quên mật khẩu, xác thực email #}
<script>
let CH=null;
Object.assign(A,{
logout(){api('POST','auth/logout/',{}).finally(()=>location.replace('/login/'));return`<div class="card" style="text-align:center"><h1>Đang đăng xuất…</h1></div>`},
login(){return CH?twoStep():`<form class="card" data-f="login"><div class="logo" style="width:48px;height:48px;border-radius:15px">${ic('lock',26)}</div><h1>Chào mừng trở lại</h1><p class="mut">Đăng nhập để điều khiển cửa thông minh.</p><div id="err"></div><label>Email hoặc username</label><input name="identifier" autocomplete="username" required><label>Mật khẩu</label><input name="password" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;justify-content:center">Đăng nhập</button><p class="sm" style="text-align:center;margin:16px 0 0"><a data-l href="/password-reset/">Quên mật khẩu?</a> · <a data-l href="/register/">Tạo tài khoản</a></p></form>`},
register(){if(BOOT.disabled)return`<div class="card"><h1>Đăng ký đang đóng</h1><p class="mut">Hệ thống tạm thời không nhận đăng ký mới.</p><a data-l href="/login/">Về đăng nhập</a></div>`;return`<form class="card" data-f="register"><h1>Tạo tài khoản</h1><p class="mut">Chỉ mất một phút.</p><div id="err"></div><label>Họ tên</label><input name="full_name"><label>Username</label><input name="username" required><label>Email</label><input name="email" type="email" required><label>Mật khẩu</label><input name="password" type="password" minlength="8" required><button class="btn" style="width:100%;justify-content:center">Đăng ký</button><p class="sm" style="text-align:center;margin:16px 0 0"><a data-l href="/login/">Đã có tài khoản?</a></p></form>`},
reset(){return`<form class="card" data-f="reset"><h1>Quên mật khẩu</h1><p class="mut">Nhập email để nhận link đặt lại.</p><div id="err"></div><input name="email" type="email" required placeholder="email@vidu.com"><button class="btn" style="width:100%;justify-content:center">Gửi link</button><p class="sm" style="text-align:center;margin:16px 0 0"><a data-l href="/login/">Quay lại</a></p></form>`},
confirm(){return`<form class="card" data-f="confirm"><h1>Mật khẩu mới</h1><div id="err"></div><label>Mật khẩu mới</label><input name="new_password" type="password" minlength="8" required><button class="btn" style="width:100%;justify-content:center">Đặt lại</button></form>`},
verify(){return`<div class="card" id="vf" style="text-align:center"><h1>Đang xác thực email…</h1></div>`}
});
function twoStep(){const all=CH.methods,m=all.filter(x=>x!=='fido2'),pk=all.includes('fido2');return`<form class="card" data-f="2fa"><h1>Xác thực 2 lớp</h1><p class="mut">Chọn cách xác thực để hoàn tất đăng nhập.</p><div id="err"></div>${pk?`<button type="button" class="btn" data-a="pkLogin" style="width:100%;justify-content:center;margin-bottom:14px">🔑 Dùng passkey / vân tay</button>`:''}${m.length?`${m.length>1?`<select name="method">${m.map(x=>`<option value="${x}" ${x===CH.pref?'selected':''}>${x==='totp'?'Google Authenticator':'Email OTP'}</option>`).join('')}</select>`:`<input type="hidden" name="method" value="${m[0]}">`}<input name="code" inputmode="numeric" maxlength="8" placeholder="123456" autocomplete="one-time-code" required style="text-align:center;font-size:22px;letter-spacing:6px">${m.includes('email')?`<button type="button" class="btn g s" data-a="sendMail" style="margin-bottom:12px">Gửi mã qua email</button>`:''}<button class="btn" style="width:100%;justify-content:center">Xác nhận</button>`:''}</form>`}
async function doVerify(){const r=await api('POST','auth/verify-email/',{token:ROUTE.token||BOOT.token});$('#vf').innerHTML=r.ok?`<h1>✅ Đã xác thực</h1><p class="mut">${esc(r.d.message||'')}</p><a class="btn" data-l href="/login/">Đăng nhập</a>`:`<h1>Link không hợp lệ</h1><p class="mut">${esc(em(r))}</p><a data-l href="/login/">Về đăng nhập</a>`}
Object.assign(ACT,{
async sendMail(){const r=await api('POST','auth/2fa/email/send/',{challenge_token:CH.token});toast(r.ok?'Đã gửi mã tới '+r.d.masked_email:em(r),!r.ok)},
async pkLogin(){if(!window.PublicKeyCredential)return toast('Trình duyệt không hỗ trợ passkey.',1);const r=await api('POST','auth/2fa/passkey/options/',{challenge_token:CH.token});if(!r.ok)return toast(em(r),1);
 try{const o=r.d.options;o.challenge=b2b(o.challenge);(o.allowCredentials||[]).forEach(c=>c.id=b2b(c.id));const c=await navigator.credentials.get({publicKey:o}),x=c.response;
  const f=await api('POST','auth/2fa/passkey/finish/',{challenge_token:CH.token,credential:{id:c.id,rawId:b2s(c.rawId),type:c.type,response:{clientDataJSON:b2s(x.clientDataJSON),authenticatorData:b2s(x.authenticatorData),signature:b2s(x.signature),userHandle:x.userHandle?b2s(x.userHandle):null},clientExtensionResults:{}}});
  if(f.ok){CH=null;location.replace(BOOT.next||'/')}else toast(em(f),1)}catch(e){toast(e.name==='NotAllowedError'?'Đã hủy hoặc hết thời gian chờ.':e.message,1)}}
});
Object.assign(ACT,{async resend(el){const r=await api('POST','auth/resend-verification/',{email:el.dataset.i});toast(r.ok?'Đã gửi lại email kích hoạt':em(r),!r.ok)}});
Object.assign(FORMS,{
async login(b,e){const r=await api('POST','auth/login/',{...b,client:'web'});if(r.ok&&r.d.two_factor_required){CH={token:r.d.challenge_token,methods:r.d.methods,pref:r.d.preferred_method};return render()}
 if(r.ok){return location.replace(BOOT.next||new URLSearchParams(location.search).get('next')||'/')}
 e.innerHTML=`<div class="err">${esc(em(r))}${r.d?.error?.code==='EMAIL_NOT_VERIFIED'?` <a href="#" data-a="resend" data-i="${esc(b.identifier)}">Gửi lại email</a>`:''}</div>`},
async '2fa'(b,e){const r=await api('POST','auth/2fa/verify/',{challenge_token:CH.token,method:b.method,code:b.code});if(r.ok){CH=null;return location.replace(BOOT.next||'/')}e.innerHTML=`<div class="err">${esc(em(r))}</div>`},
async register(b,e){const r=await api('POST','auth/register/',b);$('#app').innerHTML=r.ok?`<div class="auth"><div class="card" style="text-align:center"><h1>📬 Kiểm tra email</h1><p class="mut">${esc(r.d.message||'Chúng tôi đã gửi link kích hoạt tới email của bạn.')}</p><a data-l href="/login/">Về đăng nhập</a></div></div>`:$('#app').innerHTML;if(!r.ok)e.innerHTML=`<div class="err">${esc(em(r))}</div>`},
async reset(b,e){const r=await api('POST','auth/password-reset/',b);e.innerHTML=r.ok?`<div class="err" style="background:rgba(16,185,129,.12);color:var(--ok)">Nếu email đã đăng ký, link đặt lại đã được gửi (kiểm tra cả Spam).</div>`:`<div class="err">${esc(em(r))}</div>`},
async confirm(b,e){const r=await api('POST','auth/password-reset/confirm/',{uid:ROUTE.uid,token:ROUTE.token,new_password:b.new_password});if(r.ok){toast('Đã đổi mật khẩu');go('/login/')}else e.innerHTML=`<div class="err">${esc(em(r))}</div>`},
});
</script>
