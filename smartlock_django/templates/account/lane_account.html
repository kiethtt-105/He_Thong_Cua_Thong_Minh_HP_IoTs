{# LANE account v2: hồ sơ, bảo mật (mật khẩu, 2FA, passkey), thiết bị đăng nhập, dữ liệu & xóa tài khoản #}
<style>
.ac{display:grid;gap:16px;max-width:720px}
.ac>.card,.ac>.tabs{margin:0}
.ac .tabs{width:100%}
.ac-tabs>*{flex:1;position:relative}
.ac-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.ac-id{display:flex;align-items:center;gap:16px}
.ac-id .f{min-width:0;flex:1}
.ac-id b{display:block;font-family:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-id .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-avbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none}
.ac-avbtn .av{width:72px;height:72px;font-size:28px}
.ac-avbtn i{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--a)}
.ac-strip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--sh)}
button.ac-strip{cursor:pointer}
.ac-strip .f{flex:1;min-width:0}.ac-strip b{display:block}
.ac-strip.ok{border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.ac-strip.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.ac-link{border:0;background:none;font-family:inherit;font-weight:600;font-size:14px;color:var(--a);min-height:44px;padding:0 12px;cursor:pointer;border-radius:10px;white-space:nowrap}
.ac-link:hover{background:var(--soft)}.ac-link.bad{color:var(--bad)}.ac-link.mut{color:var(--mut)}
.ac-sub{color:var(--mut);font-size:13px;margin:-6px 0 8px}
.ac-note{font-size:13px;color:var(--mut);margin:0 0 14px}
.ac-guide{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--soft);font-size:13px;color:var(--mut);margin:10px 0 4px}
.ac-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.card.ac-danger{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 5%,var(--card))}
.ac-danger h2{color:var(--bad)}
.ac-steps{display:flex;gap:6px;margin:-4px 0 14px}.ac-steps i{flex:1;height:4px;border-radius:9px;background:var(--soft)}.ac-steps i.on{background:var(--a)}
.ac-qr{display:block;width:196px;height:196px;margin:4px auto 12px;padding:10px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.ac-secret{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 14px;margin-bottom:10px}
.ac-secret code{font:600 14px ui-monospace,monospace;letter-spacing:1px;word-break:break-all;flex:1}
@media(max-width:900px){.ac-actions .btn{flex:1}}
</style>
<script>
(()=>{
const TABS=[['profile','Hồ sơ'],['security','Bảo mật'],['devices','Thiết bị']];
const MN={totp:'Google Authenticator',email:'Email OTP'};
const tabNow=()=>{const h=location.hash.slice(1);return TABS.some(t=>t[0]===h)?h:'profile'};
const nMethods=sec=>(sec.totp?1:0)+(sec.email_otp?1:0)+(sec.passkeys||[]).length;
const guess=()=>{const u=navigator.userAgent;return /iPhone|iPad/.test(u)?'iPhone / iPad':/Android/.test(u)?'Điện thoại Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Máy Windows':'Thiết bị này'};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('Đã sao chép')}catch(x){toast('Không sao chép được. Hãy chọn mã và sao chép thủ công.',1)}};
const acts=(ok,cls='')=>`<div class="ac-actions"><button type="button" class="ac-link mut" data-a="close">Hủy</button><button class="btn ${cls}">${ok}</button></div>`;
const showErr=(e,m)=>{if(e&&'innerHTML' in e)e.innerHTML=`<div class="err">${esc(m)}</div>`};

/* ---------- khối giao diện ---------- */
const idCard=u=>`<div class="card ac-id"><button type="button" class="ac-avbtn" data-a="avPick" aria-label="Đổi ảnh đại diện"><span class="av">${avIn(u.avatar,u.initials||ini1(u.full_name||u.username||u.email))}</span><i>${ic('plus',14)}</i></button><div class="f"><b>${esc(u.full_name||u.username||'')}</b><div class="mut sm em">${esc(u.email)}</div></div><input type="file" id="avFile" accept="image/jpeg,image/png,image/webp" hidden></div>`;

function strip(sec,t){const n=nMethods(sec),click=!n&&t!=='security',pk=(sec.passkeys||[]).length;
 const parts=[sec.totp&&'Authenticator',sec.email_otp&&'Email OTP',pk&&pk+' passkey'].filter(Boolean).join(' · ');
 const inner=`<div class="ib ${n?'ok':'warn'}">${ic(n?'shield':'alert',20)}</div><div class="f"><b>${n?'Tài khoản đã bảo vệ 2 lớp':'Chưa bật xác thực 2 lớp'}</b><div class="sm mut">${n?esc(parts):t==='security'?'Hiện chỉ có mật khẩu bảo vệ tài khoản. Hãy bật một cách bên dưới.':'Hiện chỉ có mật khẩu bảo vệ tài khoản.'}</div></div>${click?'<span class="pill warn">Bật ngay</span>':''}`;
 return click?`<button type="button" class="ac-strip warn" data-a="acTab" data-k="security">${inner}</button>`:`<div class="ac-strip ${n?'ok':'warn'}" role="status">${inner}</div>`}

const tProfile=u=>`<form class="card" data-f="acMe"><h2>Thông tin cá nhân</h2><div id="err"></div>
 <label>Email</label><input value="${esc(u.email)}" disabled>
 <label>Họ tên</label><input name="full_name" value="${esc(u.full_name)}" autocomplete="name">
 <label>Số điện thoại</label><input name="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(u.phone)}">
 <div class="row" style="padding:2px 0 8px"><div class="f"><label style="display:block">Ảnh đại diện</label><div class="sm mut">JPG, PNG hoặc WebP, tự cắt vuông và thu nhỏ.</div></div><button type="button" class="ac-link" data-a="avPick">Đổi ảnh</button>${(u.avatar||'').startsWith('/api/')?`<button type="button" class="ac-link bad" data-a="avDel">Xóa ảnh</button>`:''}</div>
 <div class="ac-actions"><button class="btn" disabled>Lưu thay đổi</button></div></form>
 <div class="card"><h2>Dữ liệu của tôi</h2><div class="row" style="padding:0"><div class="f sm mut">Tải về bản sao dữ liệu cá nhân của bạn.</div><a class="btn g s" href="/api/app/me/export/">Tải dữ liệu</a></div></div>
 <div class="card ac-danger"><h2>Vùng nguy hiểm</h2><div class="row" style="padding:0"><div class="f sm mut">Xóa tài khoản không thể hoàn tác. Hãy tải dữ liệu của bạn trước nếu cần.</div><button class="btn d s" data-a="acDel">Xóa tài khoản</button></div></div>`;

function mrow(icon,on,title,desc,act){return`<div class="row"><div class="ib ${on?'ok':''}">${ic(icon,18)}</div><div class="f"><b>${title}</b> ${on?'<span class="pill ok">Đang bật</span>':''}<div class="sm mut">${desc}</div></div>${act}</div>`}

function tSecurity(sec){const n=nMethods(sec),pk=sec.passkeys||[];
 const on=(a,first)=>`<button class="btn s ${first&&!n?'':'g'}" data-a="${a}">Bật</button>`;
 const off=m=>`<button class="ac-link bad" data-a="acRm" data-m="${m}">Tắt</button>`;
 return`<div class="card"><h2>Mật khẩu</h2><div class="row" style="padding:0"><div class="f sm mut">Dùng để đăng nhập và xác nhận các thay đổi nhạy cảm.</div><button class="btn g s" data-a="acPw">Đổi mật khẩu</button></div></div>
 <div class="card"><h2>Xác thực 2 lớp</h2><p class="ac-sub">${n?'Mỗi lần đăng nhập cần thêm một bước xác minh. Nên giữ ít nhất hai cách để không bị khóa ngoài tài khoản.':'Thêm một bước xác minh khi đăng nhập để người khác không vào được tài khoản chỉ bằng mật khẩu.'}</p>
 ${mrow('shield',sec.totp,'Google Authenticator',sec.totp?'Mã 6 số từ ứng dụng xác thực.':'Dùng ứng dụng tạo mã 6 số, hoạt động cả khi không có mạng.',sec.totp?off('totp'):on('acTotpNew',1))}
 ${mrow('mail',sec.email_otp,'Email OTP',sec.email_otp?'Mã gửi tới email mỗi lần đăng nhập.':'Nhận mã qua email mỗi lần đăng nhập.',sec.email_otp?off('email'):on('acEmailNew'))}
 ${mrow('key',pk.length,'Passkey',pk.length?pk.length+' passkey đã đăng ký.':'Đăng nhập bằng vân tay, khuôn mặt hoặc khóa bảo mật.',`<button class="btn s ${pk.length?'g':n?'g':''}" data-a="acPkNew">Thêm passkey</button>`)}
 ${pk.map(k=>`<div class="row sm" style="padding-left:58px"><div class="f"><b>${esc(k.name)}</b>${k.usable_here===false?` <span class="pill warn">Chỉ dùng ở ${esc(k.rp_id)}</span>`:''}<div class="mut">Thêm ${ago(k.created_at)}</div></div><button class="ac-link bad" data-a="acRmPk" data-id="${esc(k.id)}" data-n="${esc(k.name)}">Xóa</button></div>`).join('')}</div>`}

function tDevices(sec){const ss=sec.sessions||[],others=ss.filter(s=>!s.is_current).length;
 return`<div class="card"><h2>Thiết bị đang đăng nhập</h2><p class="ac-sub">Các thiết bị đang giữ phiên đăng nhập ứng dụng của bạn. Thấy thiết bị lạ thì đăng xuất ngay rồi đổi mật khẩu.</p>
 ${ss.map(s=>`<div class="row"><div class="ib">${ic('phone',18)}</div><div class="f"><b>${esc(s.device_name||s.platform||'Thiết bị')}</b>${s.is_current?' <span class="pill ok">Thiết bị này</span>':''}<div class="sm mut">Hoạt động ${ago(s.last_used_at||s.created_at)}</div></div>${s.is_current?'':`<button class="ac-link bad" data-a="acEnd" data-id="${esc(s.id)}" data-n="${esc(s.device_name||s.platform||'Thiết bị')}">Đăng xuất</button>`}</div>`).join('')||`<div class="ac-guide">${ic('phone',18)}<div>Chưa có thiết bị nào đăng nhập ứng dụng. Khi bạn đăng nhập trên điện thoại, thiết bị sẽ hiện ở đây để bạn quản lý.</div></div>`}
 ${others?`<div class="ac-actions" style="justify-content:flex-start"><button class="ac-link bad" data-a="acEndAll">Đăng xuất tất cả thiết bị khác</button></div>`:''}</div>
 <div class="card"><h2>Phiên web này</h2><div class="row" style="padding:0"><div class="f sm mut">Bạn đang đăng nhập trên trình duyệt này.</div><button class="btn g s" data-a="logout">Đăng xuất</button></div></div>`}

Object.assign(V,{
profile(){const u=S.user||{},sec=S.security||{},t=tabNow();
 return shell(`<div class="ac">${idCard(u)}${strip(sec,t)}<div class="tabs ac-tabs" role="tablist">${TABS.map(([k,l])=>`<button type="button" role="tab" aria-selected="${k===t}" class="${k===t?'on':''}" data-a="acTab" data-k="${k}">${l}${k==='security'&&!nMethods(sec)?'<i class="ac-dot" title="Cần chú ý"></i>':''}</button>`).join('')}</div>${t==='security'?tSecurity(sec):t==='devices'?tDevices(sec):tProfile(u)}</div>`,'Tài khoản')}
});

/* ---------- ảnh đại diện ---------- */
async function avResize(file){try{const bm=await createImageBitmap(file,{imageOrientation:'from-image'});const s=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,512,512);x.drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,512,512);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));return b||file}catch(e){return file}}
async function avUpload(file){if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type))return toast('Chỉ nhận ảnh JPG, PNG hoặc WebP. Hãy chọn ảnh khác.',1);
 if(file.size>40*1024*1024)return toast('Ảnh quá lớn (trên 40 MB). Hãy chọn ảnh nhỏ hơn.',1);
 toast('Đang tải ảnh lên…');const blob=await avResize(file);
 if(blob.size>5*1024*1024)return toast('Ảnh vẫn trên 5 MB sau khi thu nhỏ. Hãy chọn ảnh khác.',1);
 const fd=new FormData();fd.append('file',blob,'avatar.jpg');await after(await apiForm('POST','me/avatar/',fd),'Đã cập nhật ảnh đại diện')}
document.addEventListener('change',e=>{if(e.target.id==='avFile'){const f=e.target.files[0];e.target.value='';avUpload(f)}});
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-f=acMe]'),b=f&&f.querySelector('.ac-actions .btn');if(b)b.disabled=false});

/* ---------- wizard bật Authenticator ---------- */
let WZ=null;
const dots=n=>`<div class="ac-steps" aria-hidden="true"><i class="on"></i><i class="${n>1?'on':''}"></i></div>`;
function totpStep(n){
 if(n===1)modal(`<h2>Bật Google Authenticator</h2>${dots(1)}<p class="ac-note">Bước 1/2 · Mở Google Authenticator hoặc ứng dụng tương tự, chọn thêm tài khoản rồi quét mã QR.</p><img class="ac-qr" src="${esc(WZ.qr)}" alt="Mã QR để thêm tài khoản vào ứng dụng xác thực"><div class="ac-secret"><code>${esc(WZ.secret)}</code><button type="button" class="ac-link" data-a="acCopy" data-v="${esc(WZ.secret)}">Sao chép</button></div><p class="ac-note" style="text-align:center">Không quét được? Nhập mã trên vào ứng dụng bằng tay.</p><div class="ac-actions"><button type="button" class="ac-link mut" data-a="close">Hủy</button><button type="button" class="btn" data-a="acTotpNext">Tiếp tục</button></div>`);
 else modal(`<form data-f="acTotp" data-id="${esc(WZ.tok)}"><h2>Nhập mã xác nhận</h2>${dots(2)}<div id="err"></div><p class="ac-note">Bước 2/2 · Nhập mã 6 số đang hiện trong ứng dụng và mật khẩu của bạn.</p><label>Mã 6 số</label><input name="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code" required style="text-align:center;font-size:22px;letter-spacing:6px"><label>Mật khẩu</label><input name="password" type="password" autocomplete="current-password" required><div class="ac-actions"><button type="button" class="ac-link mut" data-a="acTotpBack">Quay lại</button><button class="btn">Bật Authenticator</button></div></form>`)}

async function emailSend(){const r=await api('POST','me/two-factor/email/send/',{});if(!r.ok)return toast(em(r),1);
 modal(`<form data-f="acEmail"><h2>Bật Email OTP</h2><div id="err"></div><p class="ac-note">Chúng tôi đã gửi mã tới ${r.d.masked_email?`<b>${esc(r.d.masked_email)}</b>`:'email của bạn'}. Chưa thấy thư? Hãy kiểm tra cả thư rác.</p><label>Mã trong email</label><input name="code" inputmode="numeric" autocomplete="one-time-code" required><label>Mật khẩu</label><input name="password" type="password" autocomplete="current-password" required><div class="ac-actions"><button type="button" class="ac-link mut" data-a="close">Hủy</button><button type="button" class="ac-link" data-a="acEmailNew">Gửi lại mã</button><button class="btn">Bật Email OTP</button></div></form>`)}

/* ---------- hành động ---------- */
Object.assign(ACT,{
acTab(el){history.replaceState(0,'','/profile/#'+el.dataset.k);render();scrollTo(0,0)},
avPick(){const f=$('#avFile');f&&f.click()},
async avDel(){if(await ask('Xóa ảnh đại diện và quay về ảnh mặc định?','Xóa ảnh'))await after(await api('DELETE','me/avatar/'),'Đã xóa ảnh đại diện')},
acCopy(el){copy(el.dataset.v)},
acPw(){modal(`<form data-f="acPw"><h2>Đổi mật khẩu</h2><div id="err"></div><label>Mật khẩu hiện tại</label><input type="password" name="old_password" autocomplete="current-password" required><label>Mật khẩu mới</label><input type="password" name="new_password" autocomplete="new-password" minlength="8" required><label>Nhập lại mật khẩu mới</label><input type="password" name="again" autocomplete="new-password" minlength="8" required><p class="ac-note">Tối thiểu 8 ký tự.</p>${acts('Đổi mật khẩu')}</form>`)},
async acTotpNew(){const r=await api('POST','me/two-factor/totp/begin/',{});if(!r.ok)return toast(em(r),1);WZ={tok:r.d.setup_token,qr:r.d.qr,secret:r.d.secret};totpStep(1)},
acTotpNext(){if(WZ)totpStep(2)},
acTotpBack(){if(WZ)totpStep(1)},
acEmailNew(){return emailSend()},
acRm(el){const m=el.dataset.m,last=nMethods(S.security||{})<=1;
 modal(`<form data-f="acRm" data-id="${esc(m)}"><h2>Tắt ${esc(MN[m]||m)}?</h2><div id="err"></div>${last?`<div class="ac-guide" style="margin-top:0">${ic('alert',18)}<div>Đây là cách xác thực cuối cùng. Sau khi tắt, tài khoản chỉ còn mật khẩu bảo vệ.</div></div>`:''}<label>Nhập mật khẩu để xác nhận</label><input name="password" type="password" autocomplete="current-password" required><div class="ac-actions"><button type="button" class="ac-link mut" data-a="close">Giữ lại</button><button class="btn d">Tắt</button></div></form>`)},
acPkNew(){if(!window.PublicKeyCredential)return toast('Trình duyệt này chưa hỗ trợ passkey. Hãy dùng Chrome, Safari hoặc Edge bản mới và mở trang bằng HTTPS.',1);
 modal(`<form data-f="acPkNew"><h2>Thêm passkey</h2><div id="err"></div><p class="ac-note">Thiết bị sẽ yêu cầu vân tay, khuôn mặt hoặc mã mở khóa màn hình để tạo passkey.</p><label>Tên gợi nhớ</label><input name="name" value="${esc(guess())}" maxlength="40" required>${acts('Tạo passkey')}</form>`)},
acRmPk(el){modal(`<form data-f="acRmPk" data-id="${esc(el.dataset.id)}"><h2>Xóa passkey “${esc(el.dataset.n)}”?</h2><div id="err"></div><label>Nhập mật khẩu để xác nhận</label><input name="password" type="password" autocomplete="current-password" required><div class="ac-actions"><button type="button" class="ac-link mut" data-a="close">Giữ lại</button><button class="btn d">Xóa passkey</button></div></form>`)},
async acEnd(el){if(await ask(`Đăng xuất “${el.dataset.n}” khỏi tài khoản?`,'Đăng xuất'))await after(await api('DELETE',`me/sessions/${el.dataset.id}/`),'Đã đăng xuất thiết bị')},
async acEndAll(){if(await ask('Đăng xuất tất cả thiết bị khác?','Đăng xuất'))await after(await api('DELETE','me/sessions/'),'Đã đăng xuất các thiết bị khác')},
acDel(){modal(`<form data-f="acDel"><h2 style="color:var(--bad)">Xóa tài khoản</h2><div id="err"></div><p class="ac-note">Việc này không thể hoàn tác. <a href="/api/app/me/export/">Tải dữ liệu của bạn</a> trước nếu cần.</p><label>Gõ XOA để xác nhận</label><input name="confirm" autocomplete="off" autocapitalize="characters" required><label>Mật khẩu</label><input name="password" type="password" autocomplete="current-password" required><div class="ac-actions"><button type="button" class="ac-link mut" data-a="close">Giữ tài khoản</button><button class="btn d">Xóa vĩnh viễn</button></div></form>`)},
async logout(){await api('POST','auth/logout/',{});location='/login/'}
});

/* ---------- gửi biểu mẫu ---------- */
Object.assign(FORMS,{
async acMe(b){await after(await api('PATCH','me/',b),'Đã cập nhật hồ sơ')},
async acPw(b,e){if(b.new_password!==b.again)return showErr(e,'Hai mật khẩu mới chưa khớp. Hãy nhập lại cho giống nhau.');
 await after(await api('POST','me/password/',{old_password:b.old_password,new_password:b.new_password}),'Đã đổi mật khẩu')},
async acTotp(b,e,tok){if(await after(await api('POST','me/two-factor/totp/confirm/',{setup_token:tok,code:String(b.code||'').trim(),password:b.password}),'Đã bật Google Authenticator'))WZ=null},
async acEmail(b){await after(await api('POST','me/two-factor/email/confirm/',{code:String(b.code||'').trim(),password:b.password}),'Đã bật Email OTP')},
async acRm(b,e,m){await after(await api('POST',`me/two-factor/methods/${m}/remove/`,b),'Đã tắt '+(MN[m]||m))},
async acRmPk(b,e,id){await after(await api('POST',`me/two-factor/passkeys/${id}/remove/`,b),'Đã xóa passkey')},
async acDel(b,e){if(norm(b.confirm).trim()!=='xoa')return showErr(e,'Hãy gõ chữ XOA để xác nhận xóa tài khoản.');
 const r=await api('DELETE','me/',{password:b.password});if(r.ok)location='/login/';else showErr(e,em(r))},
async acPkNew(b,e){try{const r=await api('POST','me/two-factor/passkey/options/',{});if(!r.ok)throw new Error(em(r));
  const o=r.d.options;o.challenge=b2b(o.challenge);o.user.id=b2b(o.user.id);(o.excludeCredentials||[]).forEach(c=>c.id=b2b(c.id));
  toast('Hãy xác nhận trên thiết bị của bạn…');
  const c=await navigator.credentials.create({publicKey:o}),x=c.response;
  await after(await api('POST','me/two-factor/passkey/register/',{name:b.name,credential:{id:c.id,rawId:b2s(c.rawId),type:c.type,response:{clientDataJSON:b2s(x.clientDataJSON),attestationObject:b2s(x.attestationObject)},clientExtensionResults:{}},transports:x.getTransports?x.getTransports():[]}),'Đã thêm passkey')
 }catch(err){showErr(e,err.name==='NotAllowedError'?'Bạn đã hủy hoặc thiết bị không phản hồi kịp. Hãy thử lại và xác nhận khi thiết bị hỏi.':err.name==='InvalidStateError'?'Thiết bị này đã có passkey cho tài khoản. Hãy thử trên thiết bị khác.':err.message)}}
});
})();
</script>
