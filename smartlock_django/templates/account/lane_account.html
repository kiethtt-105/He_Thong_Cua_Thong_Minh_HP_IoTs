{# LANE account: hồ sơ, đổi mật khẩu, 2FA (TOTP/Email/Passkey), phiên đăng nhập, dữ liệu cá nhân #}
<script>
Object.assign(V,{
profile(){const u=S.user,sec=S.security||{};return shell(`<div class="grid g2"><form class="card" data-f="me"><h2>Hồ sơ</h2><label>Email</label><input value="${esc(u.email)}" disabled><label>Họ tên</label><input name="full_name" value="${esc(u.full_name)}"><label>Số điện thoại</label><input name="phone" value="${esc(u.phone)}"><button class="btn">Lưu</button></form>
 <form class="card" data-f="pw"><h2>Đổi mật khẩu</h2><label>Mật khẩu hiện tại</label><input type="password" name="old_password" required><label>Mật khẩu mới</label><input type="password" name="new_password" required minlength="8"><button class="btn">Đổi mật khẩu</button></form>
 <div class="card"><h2>Xác thực 2 lớp</h2><div class="row"><div class="f">Google Authenticator</div>${sec.totp?`<button class="btn g s" data-a="rm" data-m="totp">Tắt</button>`:`<button class="btn s" data-a="totpNew">Bật</button>`}</div><div class="row"><div class="f">Email OTP</div>${sec.email_otp?`<button class="btn g s" data-a="rm" data-m="email">Tắt</button>`:`<button class="btn s" data-a="emailNew">Bật</button>`}</div><div class="row"><div class="f">Passkey / vân tay</div><button class="btn s" data-a="pkNew">+ Thêm</button></div>${(sec.passkeys||[]).map(k=>`<div class="row sm"><div class="f">🔑 ${esc(k.name)}<div class="mut">${ago(k.created_at)}</div></div><button class="btn g s" data-a="rmPk" data-id="${k.id}">Xóa</button></div>`).join('')}</div>
 <div class="card"><h2>Phiên đăng nhập</h2>${(sec.sessions||[]).map(s=>`<div class="row"><div class="f"><b>${esc(s.device_name||s.platform||'Thiết bị')}</b>${s.is_current?' <span class="pill ok">Hiện tại</span>':''}<div class="sm mut">${ago(s.last_used_at||s.created_at)}</div></div>${s.is_current?'':`<button class="btn g s" data-a="del" data-u="me/sessions/${s.id}/" data-t="Đăng xuất phiên này?">Thoát</button>`}</div>`).join('')}<br><button class="btn g s" data-a="del" data-u="me/sessions/" data-t="Đăng xuất mọi phiên khác?">Đăng xuất phiên khác</button></div>
 <div class="card"><h2>Dữ liệu &amp; tài khoản</h2><a class="btn g" href="/api/app/me/export/">Tải dữ liệu cá nhân</a> <button class="btn d" data-a="delAcc">Xóa tài khoản</button><br><br><button class="btn g" data-a="logout">Đăng xuất</button></div></div>`,'Tài khoản')}
});
Object.assign(ACT,{
async totpNew(){const r=await api('POST','me/two-factor/totp/begin/',{});if(!r.ok)return toast(em(r),1);modal(`<form data-f="totp" data-id="${esc(r.d.setup_token)}"><h2>Quét mã QR</h2><img src="${r.d.qr}" style="width:200px;display:block;margin:0 auto 10px;border-radius:12px"><p class="sm mut" style="text-align:center;word-break:break-all">${esc(r.d.secret)}</p><div id="err"></div><input name="code" inputmode="numeric" placeholder="Mã 6 số" required><label>Mật khẩu</label><input name="password" type="password"><button class="btn">Xác nhận</button></form>`)},
async emailNew(){const r=await api('POST','me/two-factor/email/send/',{});if(!r.ok)return toast(em(r),1);mform('Nhập mã gửi qua email',`<input name="code" inputmode="numeric" required><label>Mật khẩu</label><input name="password" type="password">`,'emailOk')},
rm(el){mform('Tắt xác thực',`<label>Nhập mật khẩu để xác nhận</label><input name="password" type="password" required>`,'rm',el.dataset.m)},
delAcc(){mform('Xóa tài khoản',`<p class="mut sm">Hành động này không thể hoàn tác.</p><input name="password" type="password" placeholder="Mật khẩu" required>`,'delAcc')},
async logout(){await api('POST','auth/logout/',{});location='/login/'},
pkNew(){if(!window.PublicKeyCredential)return toast('Trình duyệt không hỗ trợ passkey.',1);mform('Thêm passkey',`<label>Tên gợi nhớ</label><input name="name" placeholder="VD: Laptop, iPhone" required>`,'pkNew')},
rmPk(el){mform('Xóa passkey',`<label>Nhập mật khẩu để xác nhận</label><input name="password" type="password" required>`,'rmPk',el.dataset.id)}
});
Object.assign(FORMS,{
async me(b){const r=await api('PATCH','me/',b);await after(r,'Đã cập nhật hồ sơ')},
async pw(b,e){const r=await api('POST','me/password/',b);if(r.ok){toast('Đã đổi mật khẩu');e.closest('form').reset()}else toast(em(r),1)},
async totp(b,e,tok){await after(await api('POST','me/two-factor/totp/confirm/',{setup_token:tok,code:b.code,password:b.password}),'Đã bật Authenticator')},
async emailOk(b){await after(await api('POST','me/two-factor/email/confirm/',b),'Đã bật Email OTP')},
async rm(b,e,m){await after(await api('POST',`me/two-factor/methods/${m}/remove/`,b),'Đã tắt')},
async delAcc(b){const r=await api('DELETE','me/',b);if(r.ok)location='/login/';else toast(em(r),1)},
async rmPk(b,e,id){await after(await api('POST',`me/two-factor/passkeys/${id}/remove/`,b),'Đã xóa passkey')},
async pkNew(b,e){try{const r=await api('POST','me/two-factor/passkey/options/',{});if(!r.ok)throw new Error(em(r));const o=r.d.options;o.challenge=b2b(o.challenge);o.user.id=b2b(o.user.id);(o.excludeCredentials||[]).forEach(c=>c.id=b2b(c.id));
  const c=await navigator.credentials.create({publicKey:o}),x=c.response;
  await after(await api('POST','me/two-factor/passkey/register/',{name:b.name,credential:{id:c.id,rawId:b2s(c.rawId),type:c.type,response:{clientDataJSON:b2s(x.clientDataJSON),attestationObject:b2s(x.attestationObject)},clientExtensionResults:{}},transports:x.getTransports?x.getTransports():[]}),'Đã thêm passkey')}catch(err){e.innerHTML=`<div class="err">${esc(err.name==='NotAllowedError'?'Đã hủy hoặc hết thời gian chờ.':err.message)}</div>`}}
});
</script>
