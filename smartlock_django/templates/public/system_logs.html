<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát toàn hệ thống · SmartLock</title>
<style>
:root{color-scheme:light;--bg:#f3f6f2;--pn:#fff;--p2:#eaf0ea;--ln:#d3dcd3;--tx:#15252a;--mu:#52656a;--br:#0b6b63;--ok:#157f3b;--er:#c62828;--wa:#b45309;--in:#1d6fa5}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.55 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-rows:auto 1fr;grid-template-columns:220px 1fr}
:focus-visible{outline:3px solid #f0a020;outline-offset:2px}
header{grid-column:1/3;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 24px;border-bottom:2px solid var(--ln);background:var(--pn)}
h1{font-size:22px;margin:0;font-weight:800}
.bd{padding:4px 14px;border:1.5px solid var(--ln);border-radius:99px;font-size:14px;color:var(--mu);background:var(--bg)}.bd.ro{color:#fff;background:var(--br);border-color:var(--br);font-weight:600}.bd.bad{color:var(--wa);border-color:var(--wa);background:#fff7ed}
#clock{margin-left:auto;font:600 18px ui-monospace,Consolas,monospace;color:var(--tx)}
#rail{padding:16px 12px;border-right:2px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:6px;overflow:auto}
#rail button{all:unset;cursor:pointer;padding:12px 14px;border-radius:10px;color:var(--tx);font-size:17px;font-weight:600}
#rail button:hover{background:var(--p2)}#rail button[aria-selected=true]{background:var(--br);color:#fff}
#wrap{display:flex;flex-direction:column;min-width:0;min-height:0}
#sub{display:flex;gap:8px;padding:14px 24px;border-bottom:2px solid var(--ln);overflow:auto;flex:none;background:var(--pn)}
#sub button{all:unset;cursor:pointer;padding:9px 18px;border-radius:99px;color:var(--tx);border:1.5px solid var(--ln);white-space:nowrap;font-size:15px;font-weight:600}
#sub button:hover{border-color:var(--br)}#sub button[aria-selected=true]{background:var(--br);border-color:var(--br);color:#fff}
#pane{flex:1;overflow:auto;padding:22px 24px 48px}
h3{font-size:18px;color:var(--tx);font-weight:700;margin:26px 0 12px}h3:first-child{margin-top:0}
.tg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tl{background:var(--pn);border:1.5px solid var(--ln);border-left:8px solid var(--ln);border-radius:12px;padding:16px 18px}
.tl b{display:block;font-size:40px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}.tl span{color:var(--mu);font-size:15px}.tl em{display:block;font-style:normal;font-size:13px;color:var(--mu);margin-top:6px}
.tl.g{border-left-color:var(--ok)}.tl.g b{color:var(--ok)}.tl.w{border-left-color:var(--wa)}.tl.w b{color:var(--wa)}.tl.r{border-left-color:var(--er)}.tl.r b{color:var(--er)}.tl.a{border-left-color:var(--br)}.tl.a b{color:var(--br)}
.bx{background:var(--pn);border:1.5px solid var(--ln);border-radius:12px;padding:18px;margin-top:10px}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--mu)}
input,select,.b{font:inherit;font-size:15px;color:var(--tx);background:var(--pn);border:1.5px solid #b9c5ba;border-radius:8px;padding:8px 12px}
.b{cursor:pointer;font-weight:600}.b:hover:not(:disabled),input:hover,select:hover{border-color:var(--br)}.b:disabled{opacity:.45;cursor:default}
.tw{overflow:auto;border:1.5px solid var(--ln);border-radius:12px;background:var(--pn);max-height:calc(100vh - 330px)}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 16px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--p2);font-weight:700;font-size:14px;color:var(--tx);z-index:1}th[data-c]{cursor:pointer}th[data-c]:hover{color:var(--br)}
tr.rw{cursor:pointer}tr.rw:hover td{background:#f1f7f1}
code{font:14px ui-monospace,Consolas,monospace;color:var(--in)}.nl{color:#8a9a9a}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}.mu{color:var(--mu)}i{font-style:normal;font-weight:800}
.pl{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--p2);border:1.5px solid var(--ln)}
.pl.ok{background:#e6f6ea;border-color:var(--ok);color:var(--ok)}.pl.er{background:#fdeaea;border-color:var(--er);color:var(--er)}.pl.wa{background:#fff3e0;border-color:var(--wa);color:var(--wa)}
pre{margin:0;padding:14px;background:#f1f4f1;color:var(--tx);white-space:pre-wrap;word-break:break-all;font:14px ui-monospace,Consolas,monospace}
.pg{display:flex;gap:12px;align-items:center;margin-top:12px;color:var(--mu);font-size:15px}
.sp{display:flex;gap:18px;align-items:flex-start}.sd{width:270px;flex:none;max-height:calc(100vh - 250px);overflow:auto;background:var(--pn);border:1.5px solid var(--ln);border-radius:12px;padding:10px}
.sd button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;cursor:pointer;border-radius:8px;font-size:15px}
.sd button:hover{background:var(--p2)}.sd button[aria-current=true]{background:var(--br);color:#fff;font-weight:700}
.ch{display:inline-flex;gap:8px;align-items:center;padding:5px 14px;border-radius:99px;background:var(--p2);border:1.5px solid var(--ln);font-size:15px;margin:0 8px 8px 0}.ch a{color:var(--er);cursor:pointer;font-weight:800}
@media(max-width:800px){body{grid-template-columns:1fr}header{grid-column:1}#rail{flex-direction:row;border-right:0;border-bottom:2px solid var(--ln)}.sp{flex-direction:column}.sd{width:100%;max-height:200px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Giao diện pro + hiệu ứng chuyển mượt ===== */
:root{--e:cubic-bezier(.2,.7,.2,1);--sh:0 1px 2px rgba(16,40,38,.06),0 8px 22px rgba(16,40,38,.06);--sh2:0 2px 4px rgba(16,40,38,.08),0 14px 30px rgba(16,40,38,.12)}
html{scroll-behavior:smooth}body{-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#094f4a,#0b6b63 55%,#12897c);color:#fff;border-bottom:0;box-shadow:0 2px 14px rgba(9,79,74,.35);position:relative;z-index:3}
h1{display:flex;align-items:center;gap:12px;letter-spacing:.2px}
h1::before{content:"🔒";display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);font-size:20px}
header .bd{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.32);transition:background .3s var(--e),color .3s var(--e)}
header .bd.ro{background:#fff;color:#0b6b63;border-color:#fff}header .bd.bad{background:#fff3e0;color:#b45309;border-color:#fff3e0}
#clock{color:#fff}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ee2a8;margin-right:8px;vertical-align:1px}
#sync.ld::before{background:#ffd479;animation:pulse 1s ease-in-out infinite}#sync.bad::before{background:#ffb15c}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
#rail{box-shadow:2px 0 14px rgba(16,40,38,.05);position:relative;z-index:2}
#rail button{transition:background .25s var(--e),color .25s var(--e),transform .25s var(--e),box-shadow .25s var(--e)}
#rail button:hover{transform:translateX(4px)}
#rail button[aria-selected=true]{background:linear-gradient(120deg,#0b6b63,#12897c);box-shadow:0 6px 16px rgba(11,107,99,.35);transform:none}
#sub button{transition:background .25s var(--e),color .25s var(--e),border-color .25s var(--e),transform .2s var(--e),box-shadow .25s var(--e)}
#sub button:hover{transform:translateY(-2px)}#sub button[aria-selected=true]{box-shadow:0 5px 14px rgba(11,107,99,.3)}
#pane.in{animation:fi .5s var(--e)}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#pane.in .tl{animation:up .55s var(--e) both}
#pane.in .tl:nth-child(1){animation-delay:.02s}#pane.in .tl:nth-child(2){animation-delay:.07s}#pane.in .tl:nth-child(3){animation-delay:.12s}#pane.in .tl:nth-child(4){animation-delay:.17s}#pane.in .tl:nth-child(5){animation-delay:.22s}#pane.in .tl:nth-child(n+6){animation-delay:.27s}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.tl,.bx,.tw,.sd{box-shadow:var(--sh)}
.tl{transition:transform .3s var(--e),box-shadow .3s var(--e)}.tl:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.tw{transition:box-shadow .3s var(--e)}
th{box-shadow:0 1px 0 var(--ln)}
td{transition:background .2s var(--e)}
tr.rw:hover td{background:#e9f5f1}
tr.dt pre{animation:dn .3s var(--e)}@keyframes dn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#pane.in svg rect{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--e) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
input,select,.b{transition:border-color .2s var(--e),box-shadow .2s var(--e),transform .15s var(--e),background .2s var(--e)}
input:focus,select:focus{border-color:var(--br);box-shadow:0 0 0 4px rgba(11,107,99,.15);outline:0}
.b:hover:not(:disabled){background:#eef6f3;transform:translateY(-1px)}.b:active:not(:disabled){transform:scale(.97)}
.pl,.ch{transition:transform .2s var(--e)}.pl:hover,.ch:hover{transform:translateY(-1px)}
.sd button{transition:background .2s var(--e),color .2s var(--e),padding-left .2s var(--e)}.sd button:hover{padding-left:16px}
#o:empty,#b:empty{min-height:220px;border-radius:12px;background:linear-gradient(90deg,#e6ece6 25%,#f4f8f4 45%,#e6ece6 65%);background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#bccabd;border-radius:9px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#8fa493;background-clip:content-box;border:2px solid transparent}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <h1>Giám sát toàn hệ thống</h1>
  <span class="bd ro">Chỉ xem · không ghi dữ liệu</span>
  <span class="bd" id="dbi">DB…</span>
  <span class="bd" id="sync">đang tải…</span>
  <span id="clock"></span>
</header>
<nav id="rail" role="tablist" aria-label="Nhóm chức năng"></nav>
<div id="wrap"><div id="sub" role="tablist" aria-label="Tab nhỏ"></div><div id="pane"></div></div>

<script>
const $=s=>document.querySelector(s),BASE=location.pathname.replace(/\/?$/,'/');
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('vi-VN',{hour12:false}):'—';
const ago=t=>{if(!t)return'chưa bao giờ';const s=(Date.now()-new Date(t))/1e3;return s<60?Math.round(s)+' giây trước':s<3600?Math.round(s/60)+' phút trước':s<86400?Math.round(s/3600)+' giờ trước':Math.round(s/86400)+' ngày trước'};
const pill=(t,c='')=>`<span class="pl ${c}">${esc(t)}</span>`;
const tile=(v,l,c='',h='')=>`<div class="tl ${c}"><b>${esc(v)}</b><span>${l}</span>${h?`<em>${h}</em>`:''}</div>`;
const tg=(t,b)=>`<h3>${t}</h3><div class="tg">${b}</div>`;
const none=(n,m)=>`<tr><td colspan="${n}" class="nl">${m}</td></tr>`;
const yn=b=>b?'<i class="ok">✓</i>':'<i class="er">✗</i>';
const UU=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-/,DT=/^\d{4}-\d\d-\d\dT/;
const cell=v=>v===null||v===undefined?'<span class="nl">—</span>':typeof v==='boolean'?yn(v):typeof v==='object'?`<code>${esc(JSON.stringify(v)).slice(0,70)}</code>`:typeof v==='string'&&UU.test(v)?`<code title="${v}">${v.slice(0,8)}…</code>`:typeof v==='string'&&DT.test(v)?fmt(v):esc(v);

/* ---- lưu theo TAB: sessionStorage tự xoá khi đóng tab ---- */
const SS={get(k,d){try{const v=sessionStorage.getItem('sl:'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{sessionStorage.setItem('sl:'+k,JSON.stringify(v))}catch{}}};
const ST=SS.get('st',{g:'ov',s:{},f:{}});const save=()=>SS.set('st',ST);
let TOK=0,REF=null;
const sync=(m,e)=>{const el=$('#sync');el.className='bd'+(m==='err'||m==='cache'?' bad':m==='load'?' ld':'');el.textContent={load:'đang tải…',ok:'cập nhật '+new Date().toLocaleTimeString('vi-VN',{hour12:false}),cache:'bản lưu trong tab'+(e?' · '+e:''),err:'lỗi: '+e}[m]};
const mk=(path,p)=>{const u=new URL(BASE+path,location.origin);for(const[k,v]of Object.entries(p||{}))(Array.isArray(v)?v:[v]).forEach(x=>x!==''&&x!=null&&u.searchParams.append(k,x));return u};
async function load(path,p,render){
  const t=TOK,u=mk(path,p),key='c:'+path+u.search,c=SS.get(key,null);
  if(c){render(c);sync('cache')}else sync('load');
  try{const r=await fetch(u,{credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Lỗi '+r.status);SS.set(key,j);if(t===TOK){render(j);sync('ok')}}
  catch(e){if(t!==TOK)return;sync(c?'cache':'err',e.message);if(!c)render(null,e.message)}
}
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour12:false}),1000);
setInterval(()=>{if(!document.hidden&&REF)REF()},10000);

/* ---- cấu trúc tab ---- */
const G={
 ov:{n:'🏠 Tổng quan',s:[['kpi','Chỉ số chính'],['act','Hoạt động 24 giờ'],['cfg','Cấu hình & sức khỏe']]},
 dv:{n:'🔒 Thiết bị',s:[['all','Tất cả'],['physical','Khóa vật lý'],['simulated','Khóa ảo'],['alert','Cảnh báo']]},
 ev:{n:'📜 Nhật ký',s:[['all','Tất cả'],['AUDIT','Audit'],['ACCESS','Ra vào'],['NFC','NFC'],['STATUS','Trạng thái thiết bị'],['fail','Thất bại']]},
 ad:{n:'👤 Quản trị',s:[['users','Người dùng'],['logins','Lượt đăng nhập'],['ann','Thông báo hệ thống'],['cfg','Cấu hình & phân quyền']]},
 ch:{n:'🔌 API & kênh',s:[['api','Endpoint API'],['cmd','Lệnh MQTT'],['ses','Phiên app']]},
 db:{n:'🗄️ Cơ sở dữ liệu',s:[['app','Dữ liệu ứng dụng'],['sys','Django & bảo mật']]}};
function nav(){
  $('#rail').innerHTML=Object.entries(G).map(([k,g])=>`<button role="tab" data-g="${k}" aria-selected="${k===ST.g}">${g.n}</button>`).join('');
  $('#sub').innerHTML=G[ST.g].s.map(([k,n])=>`<button role="tab" data-s="${k}" aria-selected="${k===ST.s[ST.g]}">${n}</button>`).join('');
  $('#rail').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.g));
  $('#sub').querySelectorAll('button').forEach(b=>b.onclick=()=>go(ST.g,b.dataset.s));
}
function go(g,s){ST.g=g;ST.s[g]=s||ST.s[g]||G[g].s[0][0];save();TOK++;REF=null;nav();anim();V[g](ST.s[g])}
const flt=(k,d)=>(ST.f[k]=ST.f[k]||d);
const OV=()=>load('overview/',{},()=>{});
const pager=(id,p,z,t,cb)=>{const n=Math.max(1,Math.ceil(t/z));$('#'+id).innerHTML=`<button class="b" data-d="-1" ${p<=1?'disabled':''}>‹ Trước</button><span>Trang ${p}/${n} · ${t.toLocaleString('vi-VN')} dòng</span><button class="b" data-d="1" ${p>=n?'disabled':''}>Sau ›</button>`;$('#'+id).querySelectorAll('button').forEach(b=>b.onclick=()=>cb(p+ +b.dataset.d))};
const detail=(tr,obj)=>{const n=tr.nextElementSibling;if(n&&n.classList.contains('dt')){n.remove();return}tr.insertAdjacentHTML('afterend',`<tr class="dt"><td colspan="${tr.children.length}"><pre>${esc(JSON.stringify(obj,null,2))}</pre></td></tr>`)};
const V={};

/* ================= TỔNG QUAN ================= */
V.ov=s=>{
  $('#pane').innerHTML='<div id="o"></div>';
  const draw=(j,e)=>{const o=$('#o');if(!j){o.textContent=e;return}
    const d=j.devices,u=j.users,k=j.kinds,f=j.fail24,c=j.commands,st=d.filter(x=>x.stale).length,tp=d.filter(x=>x.tamper).length;
    $('#dbi').textContent=`${j.db.vendor} · ${j.db.latency_ms} ms · ${j.db.tables} bảng`;$('#dbi').className='bd'+(j.db.latency_ms>1000?' bad':'');
    if(s==='kpi')o.innerHTML=
      tg('Thiết bị',tile(d.length,'tổng thiết bị','a')+tile(d.filter(x=>x.mode==='physical').length,'khóa vật lý')+tile(d.filter(x=>x.mode==='simulated').length,'khóa ảo')+tile(d.filter(x=>x.status==='online').length,'đang online','g')+tile(st,'mất tín hiệu',st?'w':'g')+tile(tp,'cảnh báo tháo',tp?'r':'g'))+
      tg('Người dùng & bảo mật',tile(u.total,'người dùng','a')+tile(u.active,'đã kích hoạt')+tile(u.admin,'quản trị viên')+tile(u.two_fa,'bật 2FA')+tile(u.unverified,'chưa xác thực email',u.unverified?'w':'g')+tile(u.locked,'đang bị khóa đăng nhập',u.locked?'w':'g')+tile(u.sessions_active,'phiên app hoạt động'))+
      tg('Dữ liệu & lệnh',tile(k.AUDIT||0,'audit log')+tile(k.ACCESS||0,'lượt ra vào')+tile(k.NFC||0,'log NFC')+tile((k.STATUS||0).toLocaleString('vi-VN'),'bản tin trạng thái')+tile(j.commands24,'lệnh 24 giờ','a')+tile(c.failed||0,'lệnh thất bại',c.failed?'r':'g'));
    else if(s==='act'){
      const cl={AUDIT:'#0b6b63',ACCESS:'#e08a00',NFC:'#7a5bd0',STATUS:'#4a9bd0'},nm={AUDIT:'Audit',ACCESS:'Ra vào',NFC:'NFC',STATUS:'Trạng thái'},W=760,H=190,n=j.hours.length,bw=W/n;let mx=1;
      for(let i=0;i<n;i++)mx=Math.max(mx,Object.values(j.series).reduce((a,x)=>a+x[i],0));
      let sv=`<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Sự kiện theo giờ">`;
      for(let i=0;i<n;i++){let y=H;for(const q of Object.keys(cl)){const v=(j.series[q]||[])[i]||0,h=v/mx*H;y-=h;sv+=`<rect x="${i*bw+1}" y="${y}" width="${bw-2}" height="${h}" fill="${cl[q]}"><title>${j.hours[i]} · ${nm[q]}: ${v}</title></rect>`}if(i%3===0)sv+=`<text x="${i*bw}" y="${H+13}" font-size="11" fill="#52656a">${j.hours[i]}</text>`}
      o.innerHTML=`<div class="bx"><h3>Sự kiện theo giờ (cao nhất ${mx}/giờ)</h3>${sv}</svg><div style="margin-top:8px">${Object.keys(cl).map(q=>`<span class="ch"><i style="color:${cl[q]}">■</i>${nm[q]}</span>`).join('')}</div></div>`+
        `<h3>Theo loại log</h3><div class="tw"><table><thead><tr><th>Loại</th><th>Tổng</th><th>24 giờ</th><th>Thất bại 24 giờ</th></tr></thead><tbody>${Object.keys(nm).map(q=>`<tr><td>${nm[q]}</td><td>${(k[q]||0).toLocaleString('vi-VN')}</td><td>${j.kinds24[q]||0}</td><td class="${f[q]?'er':''}">${f[q]||0}</td></tr>`).join('')}</tbody></table></div>`+
        `<h3>Lệnh điều khiển theo trạng thái (toàn bộ)</h3><div>${Object.entries(c).map(([a,b])=>`<span class="ch">${a}: <b>${b}</b></span>`).join('')||'<span class="mu">Chưa có lệnh.</span>'}</div>`}
    else o.innerHTML=tg('Cơ sở dữ liệu',tile(j.db.vendor,'loại DB','a')+tile(j.db.latency_ms+' ms','độ trễ truy vấn',j.db.latency_ms>1000?'w':'g',j.db.latency_ms>1000?'DB ở xa nên trang lưu cache trong tab':'')+tile(j.db.tables,'số bảng'))+
      tg('Biến cấu hình (chỉ báo đã đặt hay chưa)',Object.entries(j.config).map(([a,b])=>tile(b?'Đã đặt':'THIẾU',a,b?'g':'r')).join(''))};
  REF=()=>load('overview/',{},draw);REF()};

/* ================= THIẾT BỊ ================= */
V.dv=s=>{
  const f=flt('dv',{q:'',st:''});
  $('#pane').innerHTML=`<div class="bar"><label>Tìm<input id="q" value="${esc(f.q)}" placeholder="tên, mã, chủ khóa, MAC"></label><label>Trạng thái<select id="st"><option value="">Tất cả</option><option value="online">Online</option><option value="offline">Offline</option><option value="stale">Mất tín hiệu</option></select></label><span class="mu" id="n"></span></div><div class="tw"><table><thead><tr><th>Tên</th><th>Loại</th><th>Trạng thái</th><th>Khóa</th><th>Pin</th><th>Sóng</th><th>Nhiệt độ</th><th>Chủ khóa</th><th>Firmware</th><th>Kết nối</th><th>Thấy lần cuối</th></tr></thead><tbody id="b"></tbody></table></div><p class="mu">Bấm vào một dòng để xem đầy đủ thông tin thiết bị.</p>`;
  $('#st').value=f.st;let J=null;
  const draw=j=>{if(j)J=j;if(!J)return;const q=f.q.toLowerCase();
    const r=J.devices.filter(x=>(s==='all'||s==='alert'||x.mode===s)&&(s!=='alert'||x.tamper||x.stale||x.battery<20)&&(!f.st||(f.st==='stale'?x.stale:x.status===f.st))&&(!q||[x.name,x.code,x.owner,x.mac].join(' ').toLowerCase().includes(q)));
    $('#n').textContent=`${r.length}/${J.devices.length} thiết bị`;
    $('#b').innerHTML=r.map((x,i)=>`<tr class="rw" data-i="${i}"><td>${esc(x.name)}<br><code>${esc(x.code)}</code></td><td>${x.mode==='simulated'?pill('Khóa ảo','wa'):pill('Vật lý')}</td><td>${pill(x.status,x.status==='online'?'ok':'')}${x.stale?' '+pill('mất tín hiệu','wa'):''}</td><td>${esc(x.lock||'—')}</td><td class="${x.battery<20?'er':''}">${x.battery}%</td><td>${x.signal??'—'}</td><td>${x.temp??'—'}</td><td>${esc(x.owner||'chưa bán')}</td><td>${esc(x.fw||'—')}</td><td>${x.radio.join(' · ')||'—'}</td><td title="${fmt(x.last_seen)}">${ago(x.last_seen)}${x.tamper?' <b class="er">⚠ bị tháo</b>':''}</td></tr>`).join('')||none(11,'Không có thiết bị khớp. Bỏ bớt bộ lọc hoặc đổi tab.');
    $('#b').onclick=e=>{const tr=e.target.closest('tr.rw');if(!tr)return;const x=r[tr.dataset.i];if(tr.nextElementSibling&&tr.nextElementSibling.classList.contains('dt'))return detail(tr,0);fetch(mk('device/'+x.id+'/'),{credentials:'same-origin'}).then(q=>q.json()).then(j=>detail(tr,j)).catch(()=>detail(tr,x))}};
  $('#q').oninput=e=>{f.q=e.target.value;save();draw()};$('#st').onchange=e=>{f.st=e.target.value;save();draw()};
  REF=()=>load('overview/',{},draw);REF()};

/* ================= NHẬT KÝ ================= */
V.ev=s=>{
  const f=flt('ev',{sv:'',m:'',dv:'',h:'24',q:'',z:'50',ar:'0'});let P=1,T=0,tm=null;
  const o=SS.get('c:overview/',null),dvs=o?o.devices:[];
  $('#pane').innerHTML=`<div class="bar"><label>Mức<select id="sv"><option value="">Mọi mức</option><option>info</option><option>warning</option><option>critical</option></select></label>${s==='ACCESS'||s==='all'?'<label>Kênh mở<select id="m"><option value="">Mọi kênh</option><option>RFID</option><option>PIN</option><option>FACE</option><option>BLE</option><option>NFC_PHONE</option></select></label>':''}<label>Thiết bị<select id="dv"><option value="">Tất cả</option>${dvs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label><label>Khoảng<select id="h"><option value="1">1 giờ</option><option value="24">24 giờ</option><option value="168">7 ngày</option><option value="720">30 ngày</option><option value="">Toàn bộ</option></select></label><label>Tìm<input id="q" value="${esc(f.q)}" placeholder="hành động, user, IP, lý do"></label><label>Dòng<select id="z"><option>25</option><option>50</option><option>100</option><option>200</option></select></label><label>Tự làm mới<select id="ar"><option value="0">Tắt</option><option value="5000">5 giây</option><option value="15000">15 giây</option></select></label></div><div class="tw"><table><thead><tr><th>Thời gian</th><th>Loại</th><th>Sự kiện</th><th>Người</th><th>Thiết bị</th><th>Kênh</th><th>IP</th><th>Mức</th><th>KQ</th></tr></thead><tbody id="b"></tbody></table></div><div class="pg" id="pg"></div><p class="mu">Bấm vào một dòng để xem metadata, user-agent và lý do.</p>`;
  for(const k of ['sv','m','dv','h','z','ar'])if($('#'+k))$('#'+k).value=f[k];
  const run=()=>load('events/',{kind:/^[A-Z]+$/.test(s)?s:'',ok:s==='fail'?'0':'',severity:f.sv,method:f.m,device:f.dv,hours:f.h,q:f.q,page:P,size:f.z},j=>{
    if(!j){$('#b').innerHTML=none(9,'Lỗi tải nhật ký.');return}T=j.total;
    $('#b').innerHTML=j.rows.map((x,i)=>`<tr class="rw" data-i="${i}"><td>${fmt(x.time)}</td><td>${x.kind}</td><td>${esc(x.what||'—')}</td><td>${esc(x.who||'—')}</td><td>${esc(x.device||'—')}</td><td>${x.channel}</td><td>${esc(x.ip||'—')}</td><td class="${x.sev==='critical'?'er':x.sev==='warning'?'wa':''}">${x.sev}</td><td>${yn(x.ok)}</td></tr>`).join('')||none(9,'Không có sự kiện khớp. Thử nới khoảng thời gian.');
    $('#b').onclick=e=>{const tr=e.target.closest('tr.rw');if(tr)detail(tr,j.rows[tr.dataset.i])};pager('pg',j.page,j.size,T,p=>{P=p;run()})});
  for(const k of ['sv','m','dv','h','z'])if($('#'+k))$('#'+k).onchange=e=>{f[k]=e.target.value;save();P=1;run()};
  let d;$('#q').oninput=e=>{f.q=e.target.value;save();clearTimeout(d);d=setTimeout(()=>{P=1;run()},350)};
  $('#ar').onchange=e=>{f.ar=e.target.value;save();clearInterval(tm);if(+f.ar)tm=setInterval(()=>{if(document.hidden||!$('#ar')||ST.g!=='ev')clearInterval(tm);else run()},+f.ar)};
  $('#ar').onchange({target:$('#ar')});run()};


/* ================= QUẢN TRỊ (chỉ đọc) ================= */
const RL={superuser:'er',admin:'wa',user:''};
function LIST(path,opts,heads,row){
  const f=flt(path,{q:'',st:''});let P=1;
  $('#pane').innerHTML=`<div class="bar"><label>Tìm<input id="q" value="${esc(f.q)}" placeholder="tìm kiếm"></label>${opts.length?`<label>Lọc<select id="st">${opts.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label>`:''}<span class="mu" id="n"></span></div><div class="tw"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="b"></tbody></table></div><div class="pg" id="pg"></div><p class="mu">Bấm vào một dòng để xem đầy đủ.</p>`;
  if($('#st'))$('#st').value=f.st;
  const run=()=>load(path+'/',{q:f.q,status:f.st,page:P,size:25},j=>{if(!j){$('#b').innerHTML=none(heads.length,'Lỗi tải dữ liệu.');return}
    $('#n').textContent=j.total.toLocaleString('vi-VN')+' bản ghi';
    $('#b').innerHTML=j.rows.map((x,i)=>`<tr class="rw" data-i="${i}">${row(x)}</tr>`).join('')||none(heads.length,'Không có bản ghi khớp.');
    $('#b').onclick=e=>{const tr=e.target.closest('tr.rw');if(tr)detail(tr,j.rows[tr.dataset.i])};pager('pg',j.page,j.size,j.total,p=>{P=p;run()})});
  let d;$('#q').oninput=e=>{f.q=e.target.value;save();clearTimeout(d);d=setTimeout(()=>{P=1;run()},350)};
  if($('#st'))$('#st').onchange=e=>{f.st=e.target.value;save();P=1;run()};run()}
const td=(...a)=>a.map(x=>`<td>${x}</td>`).join('');
V.ad=s=>{
  if(s==='users')return LIST('users',[['','Tất cả'],['active','Đang hoạt động'],['inactive','Vô hiệu hóa'],['unverified','Chưa xác thực email'],['locked','Đang bị khóa'],['admin','Quản trị viên'],['2fa','Đã bật 2FA']],
    ['Email','Tên đăng nhập','Họ tên','Vai trò','Hoạt động','Email','2FA','Khóa đăng nhập','Số khóa','Tạo lúc'],
    x=>td(esc(x.email),esc(x.username),esc(x.full_name||'—'),pill(x.role,RL[x.role]),yn(x.is_active),yn(x.email_verified),yn(x.two_fa_enabled),x.is_locked?pill('đang khóa','wa'):'—',x.device_count??0,fmt(x.created_at)));
  if(s==='logins')return LIST('logins',[['','Tất cả'],['ok','Thành công'],['fail','Thất bại']],['Thời gian','Tài khoản thử','Người dùng','IP','Cổng','Kết quả','Hành động','Trình duyệt'],
    x=>td(fmt(x.created_at),esc(x.identifier||'—'),esc(x.user?x.user.email:'—'),esc(x.ip_address||'—'),x.is_manage_portal?pill('Quản trị','wa'):pill('Người dùng'),yn(x.success),`<code>${esc(x.action)}</code>`,esc((x.user_agent||'—').slice(0,50))));
  if(s==='ann')return LIST('announcements',[['','Tất cả'],['active','Đang hiển thị'],['inactive','Đã ẩn']],['Tiêu đề','Mức','Hiển thị','Người tạo','Tạo lúc','Nội dung'],
    x=>td(esc(x.title),pill(x.level,x.level==='danger'?'er':x.level==='warning'?'wa':''),yn(x.is_active),esc(x.created_by?x.created_by.email:'—'),fmt(x.created_at),esc((x.body||'').slice(0,80))));
  $('#pane').innerHTML='<div id="o"></div>';
  const draw=j=>{if(!j){$('#o').textContent='Lỗi tải dữ liệu.';return}const c=j.settings;
    $('#o').innerHTML=tg('Cài đặt hệ thống',tile(c.registration_enabled?'Mở':'Đóng','đăng ký tài khoản',c.registration_enabled?'g':'w')+tile(c.session_timeout_hours+' giờ','hết hạn phiên người dùng','a')+tile(c.verification_token_expiry_minutes+' phút','hạn link xác thực email')+tile(c.share_code_expiry_minutes+' phút','hạn mã chia sẻ khóa')+tile(c.login_lockout_stage_minutes.join(' → ')+' phút','mốc khóa khi sai mật khẩu','w')+tile(Math.round(j.session_seconds/60)+' phút','phiên trang quản trị'))+
      tg('Phân quyền',tile(j.roles.superuser,'superuser','r')+tile(j.roles.admin,'quản trị viên','w')+tile(j.roles.user,'người dùng thường')+tile(j.admin_full_power?'Bật':'Tắt','ADMIN_FULL_POWER (admin làm thao tác nhạy cảm)',j.admin_full_power?'w':'g'))+
      `<h3>Danh sách tài khoản quản trị</h3><div class="tw"><table><thead><tr><th>Email</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Đăng nhập lần cuối</th></tr></thead><tbody>${j.admins.map(a=>`<tr>${td(esc(a.email),esc(a.username),pill(a.role,RL[a.role]),fmt(a.last_login))}</tr>`).join('')}</tbody></table></div><p class="mu">Cập nhật lần cuối: ${fmt(c.updated_at)}${c.updated_by?' bởi '+esc(c.updated_by.email):''}. Trang này chỉ xem; thao tác ghi làm ở trang quản trị /manage-sys/ (có xác nhận lại mật khẩu và ghi audit).</p>`};
  REF=()=>load('admin-settings/',{},draw);REF()};

/* ================= API & KÊNH ================= */
V.ch=s=>{
  if(s==='api'){const f=flt('ch',{q:''});$('#pane').innerHTML=`<div id="t"></div><div class="bar" style="margin-top:14px"><label>Tìm endpoint<input id="q" value="${esc(f.q)}" placeholder="đường dẫn, tên, mô tả"></label></div><div id="r"></div><h3>Hành động audit nhiều nhất 24 giờ</h3><div class="tw"><table><thead><tr><th>Hành động</th><th>Lượt</th><th>Thất bại</th></tr></thead><tbody id="a"></tbody></table></div>`;let J=null;
    const draw=j=>{if(j)J=j;if(!J)return;const q=f.q.toLowerCase();
      $('#t').innerHTML='<div class="tg">'+tile(J.health.status==='up'?'Hoạt động':'LỖI','kết nối DB',J.health.status==='up'?'g':'r')+tile(J.health.ms??'—','ms truy vấn DB')+J.groups.map(g=>tile(g.routes.length,g.label,'a')).join('')+'</div>';
      $('#a').innerHTML=J.top_actions_24h.map(x=>`<tr><td>${esc(x.action||'(trống)')}</td><td>${x.n}</td><td class="${x.bad?'er':''}">${x.bad}</td></tr>`).join('')||none(3,'Chưa có audit log trong 24 giờ.');
      $('#r').innerHTML=J.groups.map(g=>{const r=g.routes.filter(x=>!q||[x.path,x.name,x.doc].join(' ').toLowerCase().includes(q));return r.length?`<h3>/api/${esc(g.key)}/ · ${esc(g.label)} · ${r.length} endpoint</h3><div class="tw"><table><tbody>${r.map(x=>`<tr><td><code>${esc(x.path)}</code></td><td class="mu">${esc(x.module)}</td><td class="mu" title="${esc(x.doc)}">${esc(x.doc)}</td></tr>`).join('')}</tbody></table></div>`:''}).join('')||'<p class="mu">Không có endpoint khớp.</p>'};
    $('#q').oninput=e=>{f.q=e.target.value;save();draw()};REF=()=>load('api/',{},draw);REF();return}
  $('#pane').innerHTML='<div id="o"></div>';
  const draw=j=>{const o=$('#o');if(!j){o.textContent='Lỗi tải dữ liệu.';return}
    if(s==='cmd'){const bad=j.by.filter(x=>x.status==='failed'||x.status==='expired').reduce((a,x)=>a+x.n,0);
      o.innerHTML=tg('Kết nối',tile(j.mqtt.host_set?'Đã đặt':'THIẾU','MQTT_HOST',j.mqtt.host_set?'g':'r')+tile(j.mqtt.webhook_secret_set?'Đã đặt':'THIẾU','MQTT_WEBHOOK_SECRET',j.mqtt.webhook_secret_set?'g':'r')+tile(j.fcm_set?'Đã đặt':'Chưa bật','Firebase push',j.fcm_set?'g':'w')+tile(j.ack_latency_s==null?'—':j.ack_latency_s+' s','độ trễ xác nhận TB 24 giờ','a')+tile(bad,'thất bại / hết hạn 24 giờ',bad?'w':'g')+tile(j.offline_after_s+' s','ngưỡng coi là offline'))+
        `<h3>Lệnh 24 giờ theo loại</h3><div>${j.by.map(x=>`<span class="ch">${x.type} · ${x.status}: <b>${x.n}</b></span>`).join('')||'<span class="mu">Không có lệnh.</span>'}</div><h3>60 lệnh gần nhất</h3><div class="tw"><table><thead><tr><th>Thời gian</th><th>Thiết bị</th><th>Lệnh</th><th>Trạng thái</th><th>Người gửi</th><th>Xác nhận</th><th>Hết hạn</th><th>Nguồn</th></tr></thead><tbody>${j.recent.map(c=>`<tr><td>${fmt(c.time)}</td><td>${esc(c.device)}</td><td>${c.type}</td><td>${pill(c.status,c.status==='acknowledged'?'ok':c.status==='failed'?'er':c.status==='expired'?'wa':'')}</td><td>${esc(c.by)}</td><td>${fmt(c.ack)}</td><td>${fmt(c.expires)}</td><td>${esc(c.payload&&c.payload.source||'—')}</td></tr>`).join('')||none(8,'Chưa có lệnh.')}</tbody></table></div>`}
    else o.innerHTML=`<div class="tw"><table><thead><tr><th>Người dùng</th><th>Nền tảng</th><th>Phiên bản</th><th>Máy</th><th>IP</th><th>Push</th><th>Dùng lần cuối</th><th>Hết hạn</th><th>Trạng thái</th></tr></thead><tbody>${j.sessions.map(x=>`<tr><td>${esc(x.user)}</td><td>${esc(x.platform)}</td><td>${esc(x.app)}</td><td>${esc(x.device_name)}</td><td>${esc(x.ip||'—')}</td><td>${yn(x.push)}</td><td>${ago(x.last_used)}</td><td>${fmt(x.expires)}</td><td>${pill(x.revoked?'đã thu hồi':'hoạt động',x.revoked?'er':'ok')}</td></tr>`).join('')||none(9,'Chưa có phiên app.')}</tbody></table></div>`};
  REF=()=>load('channels/',{},draw);REF()};

/* ================= CƠ SỞ DỮ LIỆU ================= */
V.db=s=>{
  const f=flt('db',{t:'',f:[],o:'',q:'',z:'50'});let P=1,TB=[],COLS=[],ROWS=[];
  $('#pane').innerHTML=`<div class="sp"><div class="sd"><label>Lọc bảng<input id="tq" placeholder="tên bảng"></label><div id="tl" style="margin-top:6px"></div></div><div style="flex:1;min-width:0"><div class="bar"><label>Tìm trong bảng<input id="q" value="${esc(f.q)}" placeholder="mọi cột văn bản"></label><label>Cột<select id="fc"></select></label><label>Phép<select id="fo"><option value="contains">chứa</option><option value="eq">bằng</option><option value="starts">bắt đầu bằng</option><option value="gt">lớn hơn</option><option value="lt">nhỏ hơn</option><option value="null">rỗng</option><option value="notnull">không rỗng</option></select></label><label>Giá trị<input id="fv"></label><button class="b" id="fa">Thêm bộ lọc</button><label>Dòng<select id="z"><option>25</option><option>50</option><option>100</option><option>200</option></select></label><button class="b" id="csv">Xuất CSV trang này</button></div><div id="chips"></div><div class="tw"><table><thead id="h"></thead><tbody id="b"></tbody></table></div><div class="pg" id="pg">Chọn một bảng ở bên trái.</div><p class="mu">Bấm vào một dòng để xem đầy đủ. Cột bí mật (hash, secret, token, embedding…) luôn bị che.</p></div></div>`;
  $('#z').value=f.z;
  const inGroup=t=>s==='app'?/^(smartlock_|manage_sys)/.test(t):!/^(smartlock_|manage_sys)/.test(t);
  const list=()=>{const q=$('#tq').value.toLowerCase();$('#tl').innerHTML=TB.filter(t=>inGroup(t.table)&&t.table.includes(q)).map(t=>`<button data-t="${t.table}" aria-current="${t.table===f.t}"><span>${esc(t.table.replace('smartlock_',''))}</span><span class="${t.table===f.t?'':'mu'}">${t.rows}</span></button>`).join('')||'<span class="mu">Không có bảng.</span>';
    $('#tl').querySelectorAll('button').forEach(b=>b.onclick=()=>{f.t=b.dataset.t;f.f=[];f.o='';f.q='';$('#q').value='';save();P=1;list();rows()})};
  const rows=()=>{if(!f.t||!inGroup(f.t)){$('#h').innerHTML='';$('#b').innerHTML='';return}
    load('db/rows/',{table:f.t,q:f.q,f:f.f,order:f.o,page:P,size:f.z},j=>{
      if(!j){$('#pg').textContent='Lỗi tải bảng.';return}COLS=j.columns;ROWS=j.rows;
      if($('#fc').dataset.t!==f.t){$('#fc').innerHTML=COLS.filter(c=>!c.secret).map(c=>`<option>${c.name}</option>`).join('');$('#fc').dataset.t=f.t}
      $('#h').innerHTML='<tr>'+COLS.map(c=>`<th data-c="${c.name}" title="${c.type}">${c.name}${f.o===c.name?' ▲':f.o==='-'+c.name?' ▼':''}</th>`).join('')+'</tr>';
      $('#h').querySelectorAll('th').forEach(th=>th.onclick=()=>{f.o=f.o===th.dataset.c?'-'+th.dataset.c:th.dataset.c;save();P=1;rows()});
      $('#b').innerHTML=j.rows.map((r,i)=>`<tr class="rw" data-i="${i}">${r.map(cell).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||none(COLS.length,'Không có dòng khớp.');
      $('#b').onclick=e=>{const tr=e.target.closest('tr.rw');if(tr)detail(tr,Object.fromEntries(COLS.map((c,k)=>[c.name,ROWS[tr.dataset.i][k]])))};
      $('#chips').innerHTML=f.f.map((x,i)=>`<span class="ch">${esc(x.split(':').join(' '))} <a data-i="${i}">✕</a></span>`).join('');
      $('#chips').querySelectorAll('a').forEach(a=>a.onclick=()=>{f.f.splice(+a.dataset.i,1);save();P=1;rows()});
      pager('pg',j.page,j.size,j.total,p=>{P=p;rows()});if(j.warnings.length)$('#pg').insertAdjacentHTML('beforeend','<span class="wa">'+esc(j.warnings.join('; '))+'</span>')})};
  $('#tq').oninput=list;$('#fa').onclick=()=>{f.f.push(`${$('#fc').value}:${$('#fo').value}:${$('#fv').value}`);save();P=1;rows()};
  let d;$('#q').oninput=e=>{f.q=e.target.value;save();clearTimeout(d);d=setTimeout(()=>{P=1;rows()},350)};
  $('#z').onchange=e=>{f.z=e.target.value;save();P=1;rows()};
  $('#csv').onclick=()=>{if(!ROWS.length)return;const q=v=>'"'+String(typeof v==='object'&&v?JSON.stringify(v):v??'').replace(/"/g,'""')+'"';const t=[COLS.map(c=>q(c.name)).join(',')].concat(ROWS.map(r=>r.map(q).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=f.t+'.csv';a.click()};
  load('db/tables/',{},j=>{if(j){TB=j.tables;list()}});rows()};

/* ---- hiệu ứng: chuyển tab mượt + đếm số ---- */
let ANIM=true,ATM=null;
function anim(){const p=$('#pane');p.classList.remove('in');void p.offsetWidth;p.classList.add('in');p.scrollTop=0;ANIM=true;clearTimeout(ATM);ATM=setTimeout(()=>p.classList.remove('in'),1100)}
function countUp(){document.querySelectorAll('#pane .tl b').forEach(b=>{const t=b.textContent.trim();if(!/^\d+$/.test(t)||+t<2)return;const n=+t,t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/700),e=1-Math.pow(1-k,3);b.textContent=Math.round(n*e);if(k<1)requestAnimationFrame(f);else b.textContent=n})(t0)})}
new MutationObserver(()=>{if(ANIM&&document.querySelector('#pane .tl b')){ANIM=false;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)countUp()}}).observe($('#pane'),{childList:true,subtree:true});

go(ST.g,ST.s[ST.g]);
