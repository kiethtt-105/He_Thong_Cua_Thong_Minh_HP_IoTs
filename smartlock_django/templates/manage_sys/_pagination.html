{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-3">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" href="?page=1{{ qs }}">«</a></li>
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{{ qs }}">‹</a></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Trang {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} mục)</span></li>
        {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{{ qs }}">›</a></li>
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.paginator.num_pages }}{{ qs }}">»</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
