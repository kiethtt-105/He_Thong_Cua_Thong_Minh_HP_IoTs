{% extends 'account/base/layout.html' %}
{% block title %}Đăng nhập quản trị{% endblock %}
{% block extra_head %}<meta name="robots" content="noindex,nofollow">{% endblock %}

{% block shell %}
<div class="auth-bg">
    <div class="container px-3 py-4">
        <div class="mx-auto" style="max-width:440px">
            <div class="text-center text-white mb-4">
                <div class="brand-icon mx-auto mb-3"><i class="fa-solid fa-shield-halved"></i></div>
                <h4 class="mb-1">Manage Sys</h4>
                <div class="small" style="color:var(--sb-text)">Khu vực dành riêng cho quản trị viên</div>
            </div>
            <div class="card auth-card mx-auto">
                <div class="card-body p-4">
                    {% for m in messages %}
                    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} py-2">{{ m }}</div>
                    {% endfor %}
                    <form method="post" autocomplete="off">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        <div class="mb-3">
                            <label class="form-label">Email hoặc Username</label>
                            <input type="text" name="identifier" class="form-control" required autofocus autocapitalize="none" autocorrect="off">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
