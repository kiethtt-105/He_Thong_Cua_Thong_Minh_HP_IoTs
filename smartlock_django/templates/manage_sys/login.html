<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Đăng nhập quản trị - Smart Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; background: #212529; }
        .login-card { max-width: 400px; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card mx-auto">
        <div class="text-center text-white mb-4">
            <i class="bi bi-shield-lock display-4"></i>
            <h4 class="mt-2 mb-0">Manage Sys</h4>
            <div class="small text-secondary">Khu vực dành riêng cho quản trị viên</div>
        </div>
        <div class="card shadow">
            <div class="card-body p-4">
                {% for message in messages %}
                <div class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag }}{% endif %} py-2">{{ message }}</div>
                {% endfor %}
                <form method="post" autocomplete="off">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label">Email hoặc Username</label>
                        <input type="text" name="identifier" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
