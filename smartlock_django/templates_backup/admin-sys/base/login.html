<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập Admin - Khoa Của Thông Minh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0b5ed7); }
        .card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .logo { font-size: 2.8rem; font-weight: 700; color: #fff; }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card p-5" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-4">
                <h1 class="logo">Khoa Của Thông Minh</h1>
                <p class="text-white-50">Đăng nhập Admin</p>
            </div>

            <form id="adminLoginForm" method="POST" onsubmit="handleAdminLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Email Admin</label>
                    <input type="email" id="adminEmail" class="form-control form-control-lg" placeholder="admin@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="adminPassword" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Đăng nhập Admin</button>

                <div class="text-center">
                    <a href="../account/login.html" class="text-white text-decoration-none">Quay về trang User</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPassword').value;

            if (!email || !pass) {
                alert('Vui lòng nhập email và mật khẩu');
                return;
            }

            alert(`Đăng nhập Admin thành công!\nEmail: ${email} (Demo)`);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
