<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Device - Khoa Của Thông Minh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Quản lý Thiết bị (12 thiết bị)</h2>
        <p class="text-muted">Nhấn nút Reset để reset remote thiết bị</p>
        
        <table class="table">
            <thead>
                <tr>
                    <th>Device Code</th>
                    <th>Status</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>LOCK-123456</td>
                    <td class="text-success">Online</td>
                    <td><button class="btn btn-danger btn-sm">Reset Remote</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
