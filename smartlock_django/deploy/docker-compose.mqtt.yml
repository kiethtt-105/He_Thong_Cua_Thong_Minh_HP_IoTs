# docker compose -f docker-compose.mqtt.yml --env-file .env up -d
services:
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest       # nên ghim phiên bản cụ thể khi lên production
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
      # - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - mosq-data:/mosquitto/data
      # - ./certs:/mosquitto/certs:ro
    depends_on: [auth-proxy]

  auth-proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DJANGO_UPSTREAM: ${DJANGO_UPSTREAM}          # vd. http://host.docker.internal:8000  hoặc  https://ten.vercel.app
      DJANGO_HOST: ${DJANGO_HOST}                  # vd. localhost  hoặc  ten.vercel.app (phải nằm trong ALLOWED_HOSTS)
      MQTT_WEBHOOK_SECRET: ${MQTT_WEBHOOK_SECRET}
    volumes:
      - ./nginx/auth-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # KHÔNG publish cổng 8080 ra ngoài: chỉ broker (cùng network compose) được gọi.

  # Subscriber phải chạy ở nơi có tiến trình sống lâu + truy cập DB (KHÔNG chạy được trên Vercel/serverless).
  # Bỏ comment và chỉnh theo cách bạn đóng gói Django:
  # subscriber:
  #   build: ../
  #   command: python manage.py mqtt_subscriber
  #   restart: unless-stopped
  #   env_file: ../.env
  #   environment:
  #     MQTT_BROKER_HOST: mosquitto
  #   depends_on: [mosquitto]

volumes:
  mosq-data:
