# Mosquitto + plugin mosquitto-go-auth (image iegomez/mosquitto-go-auth)
# Broker KHÔNG giữ danh sách thiết bị: mỗi lần connect/publish/subscribe nó hỏi Django qua webhook.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
max_packet_size 65536          # khớp MAX_PAYLOAD của subscriber
max_queued_messages 200        # tin QoS1 xếp hàng cho client offline (vd. lệnh gửi lúc khoá mất mạng)

# --- Thiết bị + server (trong mạng nội bộ / dev) ---
listener 1883

# WebSocket cho khoá ảo 3D chạy trong trình duyệt (ws://localhost:9001)
listener 9001
protocol websockets

# --- Production: bật TLS, và đặt MQTT_BROKER_USE_TLS=true bên Django ---
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key

# --- Xác thực / ACL qua Django ---
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level warn

auth_opt_http_host auth-proxy
auth_opt_http_port 8080
auth_opt_http_method POST
auth_opt_http_params_mode form
auth_opt_http_response_mode status
auth_opt_http_getuser_uri /api/mqtt/auth/
auth_opt_http_aclcheck_uri /api/mqtt/acl/
auth_opt_http_superuser_uri /api/mqtt/superuser/

# Cache để mỗi publish không phải gọi Django (Django có thể ở xa/serverless).
# Đổi: secret bị xoay / thiết bị bị gỡ vẫn dùng được tối đa ~30s với kết nối cũ.
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 30
auth_opt_acl_cache_seconds 30
