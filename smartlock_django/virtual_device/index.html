<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khoá ảo</title>
<style>
:root{--wall:#1c2428;--wall2:#242e33;--ink:#e6ecee;--mute:#93a3a9;--line:#3a484e;--amber:#ffb23e;--teal:#4fd1b0;--red:#ff6b5e;
 --plate1:#d9dcde;--plate2:#aeb4b8;--lcd:#0c1815;--lcdtx:#7fe3c1}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
main{display:grid;grid-template-columns:330px 1fr;gap:28px;max-width:1080px;margin:0 auto;padding:24px}
@media(max-width:820px){main{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
button,input{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--wall2);color:var(--ink);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--mute)}button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=text]{background:#141b1e;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 8px;width:100%}

/* ---- thân khoá ---- */
#device{width:300px;margin:0 auto;padding:22px 20px 26px;border-radius:26px;
 background:linear-gradient(100deg,var(--plate1),var(--plate2) 55%,#c4c8cb);color:#1b2326;
 box-shadow:0 1px 0 #fff8 inset,0 18px 40px #0008;position:relative}
#device[data-off="1"]{filter:saturate(.3) brightness(.8)}
.lcd{background:var(--lcd);color:var(--lcdtx);border-radius:10px;padding:10px 12px;height:96px;box-shadow:0 2px 6px #000a inset;
 display:flex;flex-direction:column;justify-content:space-between;font-family:Consolas,"Cascadia Mono",monospace}
.lcd .top{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.lcd .big{font-size:22px;letter-spacing:.04em;text-align:center}
.lcd .sub{font-size:13px;text-align:center;min-height:18px;opacity:.9}
#device[data-off="1"] .lcd *{opacity:0}
.led{position:absolute;right:18px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
#device[data-lock="unlocked"] .led{background:var(--teal);box-shadow:0 0 10px var(--teal)}
#device[data-lock="jammed"] .led,#device[data-tamper="1"] .led{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink .5s steps(2) infinite}
#device[data-off="1"] .led{background:#555;box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.led{animation:none!important}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.keys button{background:linear-gradient(#f4f5f6,#c9cdd0);color:#1b2326;border:1px solid #8c9498;border-radius:10px;height:44px;font-size:18px;box-shadow:0 2px 0 #7d858a}
.keys button:active{transform:translateY(2px);box-shadow:none}
.keys .ok{background:linear-gradient(#8fe0c8,#4fb99a)}.keys .del{background:linear-gradient(#ffd0ca,#e59a92)}
.tap{border:2px dashed #7d858a;border-radius:12px;padding:10px;display:grid;gap:6px;background:#0001}
.tap label{font-size:12px;color:#3b4549}
.tap input{background:#fff9;color:#1b2326;border-color:#8c9498}
.tap .row{display:flex;gap:6px}.tap button{background:#2b3a40;color:#fff;border-color:#2b3a40}
/* then chốt: trượt ra khi khoá, rút vào khi mở */
.track{height:34px;margin-top:14px;border-radius:17px;background:#2a3236;box-shadow:0 2px 5px #000a inset;position:relative;overflow:hidden}
.bolt{position:absolute;top:4px;left:4px;width:160px;height:26px;border-radius:13px;background:linear-gradient(#e9ecee,#9aa2a7);
 transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform:translateX(128px);display:grid;place-items:center;font-size:12px;color:#243}
#device[data-lock="unlocked"] .bolt{transform:translateX(0)}
@media(prefers-reduced-motion:reduce){.bolt{transition:none}}
.inside{display:flex;gap:8px;margin-top:12px}.inside button{flex:1;background:#2b3a40;color:#fff;border-color:#2b3a40}

/* ---- bảng điều khiển ---- */
.panel{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:var(--wall2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:center}
.tog{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;color:var(--mute);font-size:13px}
.stats b{color:var(--ink);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.pill.on{background:#1f5a4a;color:#aef0dc}.pill.off{background:#5b2a26;color:#ffc6bf}
#log{height:250px;overflow:auto;background:#10161a;border-radius:8px;padding:8px 10px;font:12px/1.5 Consolas,"Cascadia Mono",monospace}
#log div{white-space:pre-wrap;word-break:break-word}.WARNING{color:var(--amber)}.ERROR{color:var(--red)}.DEBUG{color:#6c7c82}.t{color:#6c7c82}
#ticket{margin-top:8px;font:12px Consolas,monospace;color:var(--teal);word-break:break-all}
</style>
</head>
<body>
<main>
<section aria-label="Khoá cửa">
  <div id="device" data-lock="locked">
    <span class="led" title="Đèn trạng thái"></span>
    <div class="lcd"><div class="top"><span id="net">…</span><span id="bat">–</span></div>
      <div class="big" id="big">…</div><div class="sub" id="sub"></div></div>
    <div class="keys" id="keys"></div>
    <div class="tap">
      <label for="uid">Quẹt thẻ RFID (UID)</label>
      <div class="row"><input type="text" id="uid" value="04A1B2C3" spellcheck="false"><button id="tapBtn">Quẹt</button></div>
      <button id="faceBtn">Quét khuôn mặt</button>
    </div>
    <div class="track" aria-hidden="true"><div class="bolt" id="boltTx"></div></div>
    <div class="inside"><button id="lockBtn">Khoá (trong nhà)</button><button id="unlockBtn">Mở (trong nhà)</button></div>
  </div>
</section>

<section>
  <div class="panel"><h2>Trạng thái</h2><div class="stats" id="stats"></div></div>

  <div class="panel"><h2>Mở bằng điện thoại (Bluetooth / NFC)</h2>
    <p style="margin:0 0 8px;color:var(--mute)">Vé thật do server cấp qua <code>/devices/&lt;id&gt;/ble-ticket/</code>. Để thử nhanh, nhập UUID user rồi tạo vé thử bằng secret của khoá. Khoá tự kiểm tra vé nên vẫn mở được khi offline.</p>
    <div class="grid" style="grid-template-columns:1fr auto auto">
      <input type="text" id="user" placeholder="UUID của user" spellcheck="false">
      <button data-mint="ble">Tạo vé BLE</button><button data-mint="nfc">Tạo vé NFC</button></div>
    <div class="grid" style="grid-template-columns:1fr auto auto;margin-top:8px">
      <input type="text" id="tk" placeholder="Dán vé: user.exp.sig" spellcheck="false">
      <button data-phone="ble">Đưa vé BLE</button><button data-phone="nfc">Đưa vé NFC</button></div>
    <div id="ticket"></div>
  </div>

  <div class="panel"><h2>Môi trường mô phỏng</h2>
    <div class="grid">
      <label class="tog"><input type="checkbox" id="cNet" checked> Có mạng</label>
      <label class="tog"><input type="checkbox" id="cTamper"> Cạy phá</label>
      <label class="tog"><input type="checkbox" id="cJam"> Kẹt chốt</label>
      <label class="tog"><input type="checkbox" id="cBle" checked> Radio BLE</label>
      <label class="tog"><input type="checkbox" id="cNfc" checked> Radio NFC</label>
      <button id="reboot">Khởi động lại</button>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
      <label for="batt">Pin</label><input type="range" id="batt" min="0" max="100" value="100" style="flex:1;accent-color:var(--teal)"><b id="battv">100%</b>
    </div>
  </div>

  <div class="panel"><h2>Nhật ký</h2><div id="log" role="log" aria-live="off"></div></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);let after=0,pin='',busy=0;
async function api(b){const r=await fetch('/api/do',{method:'POST',headers:{'Content-Type':'application/json','X-VD':'1'},body:JSON.stringify(b)});return r.json()}
function toast(t){$('#sub').textContent=t;clearTimeout(toast.h);toast.h=setTimeout(showPin,2500)}
function showPin(){$('#sub').textContent=pin?'•'.repeat(pin.length):''}
// bàn phím
'123456789*0#'.split('').forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k==='#'){return send()}if(k==='*'){pin='';return showPin()}if(pin.length<8)pin+=k;showPin()};$('#keys').append(b)});
async function send(){if(!pin)return;const r=await api({action:'pin',pin});pin='';toast(r.ok?'Đang xác thực…':'Offline: từ chối')}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(/^\d$/.test(e.key)&&pin.length<8){pin+=e.key;showPin()}else if(e.key==='Enter')send();else if(e.key==='Backspace'){pin=pin.slice(0,-1);showPin()}});
$('#tapBtn').onclick=async()=>{const r=await api({action:'rfid',uid:$('#uid').value});toast(r.ok?'Đang xác thực thẻ…':'Offline: từ chối')};
$('#faceBtn').onclick=async()=>{const r=await api({action:'face'});toast(r.ok?'Đang so khớp mặt…':'Offline: từ chối')};
$('#lockBtn').onclick=()=>api({action:'lock'});$('#unlockBtn').onclick=()=>api({action:'unlock'});
document.querySelectorAll('[data-mint]').forEach(b=>b.onclick=async()=>{const r=await api({action:'mint',kind:b.dataset.mint,user:$('#user').value.trim()});
 $('#ticket').textContent=r.ok?r.ticket:(r.error||'Nhập UUID user trước');if(r.ok)$('#tk').value=r.ticket});
document.querySelectorAll('[data-phone]').forEach(b=>b.onclick=async()=>{const r=await api({action:'phone',kind:b.dataset.phone,ticket:$('#tk').value});toast(r.ok?'Vé hợp lệ':'Vé bị từ chối')});
const bind=(id,fn)=>$(id).onchange=e=>api(fn(e.target));
bind('#cNet',e=>({action:'network',on:e.checked}));bind('#cTamper',e=>({action:'tamper',on:e.checked}));bind('#cJam',e=>({action:'jam',on:e.checked}));
bind('#cBle',e=>({action:'radio',which:'ble',on:e.checked}));bind('#cNfc',e=>({action:'radio',which:'nfc',on:e.checked}));
$('#batt').oninput=e=>{$('#battv').textContent=e.target.value+'%'};$('#batt').onchange=e=>api({action:'battery',value:e.target.value});
$('#reboot').onclick=()=>api({action:'reboot'});

const TXT={locked:'ĐÃ KHOÁ',unlocked:'ĐÃ MỞ',jammed:'KẸT CHỐT'};
function render(s){
 const d=$('#device');d.dataset.lock=s.lock_state;d.dataset.tamper=s.tamper?1:0;d.dataset.off=s.dead?1:0;
 $('#big').textContent=s.dead?'':(s.tamper?'CẠY PHÁ!':TXT[s.lock_state]||s.lock_state);
 $('#net').textContent=s.connected?'● online':(s.network_up?'○ đang nối…':'○ offline');
 $('#bat').textContent=s.battery+'%';$('#boltTx').textContent=s.lock_state==='unlocked'?'đã rút':'đã chốt';
 $('#stats').innerHTML=[['Mã',s.code],['Mạng',`<span class="pill ${s.connected?'on':'off'}">${s.connected?'online':'offline'}</span>`],['Pin',s.battery+'%'],
  ['Nhiệt độ',s.temperature+'°C'],['Firmware',s.firmware],['Boot','#'+s.boot],['Thẻ cục bộ',s.cards.length],['Hàng đợi offline',s.outbox],
  ['Tự khoá lại',s.auto_lock?s.auto_lock+'s':'tắt'],['Lỗi nối',s.error||'không']].map(([k,v])=>`<div>${k}<br><b>${v}</b></div>`).join('');
 const sync=(id,v)=>{if(document.activeElement!==$(id))$(id).checked=v};
 sync('#cNet',s.network_up);sync('#cTamper',s.tamper);sync('#cJam',s.lock_state==='jammed');sync('#cBle',s.ble_on);sync('#cNfc',s.nfc_on);
 if(document.activeElement!==$('#batt')){$('#batt').value=s.battery;$('#battv').textContent=s.battery+'%'}
 const log=$('#log'),stick=log.scrollTop+log.clientHeight>=log.scrollHeight-30;
 s.logs.forEach(l=>{after=Math.max(after,l.id);const r=document.createElement('div');r.className=l.lvl;
  const t=document.createElement('span');t.className='t';t.textContent=l.t+'  ';r.append(t,l.msg);log.append(r)});
 while(log.children.length>400)log.firstChild.remove();if(stick)log.scrollTop=log.scrollHeight;
}
async function poll(){try{render(await (await fetch('/api/state?after='+after)).json())}catch(e){$('#net').textContent='mất UI'}setTimeout(poll,800)}
poll();
</script>
</body>
</html>
