<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Xem trước email</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;height:100vh}
aside{width:340px;overflow:auto;padding:18px;border-right:1px solid #1e293b}
h2{margin:0 0 14px;font-size:18px}
.item{display:block;width:100%;text-align:left;background:#111c33;border:1px solid #1e293b;color:inherit;border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.item.active{border-color:#2563eb;background:#14264f}
.item b{display:block;font-size:14px}.item small{color:#94a3b8;display:block;margin-top:2px}
.ok{color:#4ade80}.bad{color:#f87171}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{padding:10px 16px;border-bottom:1px solid #1e293b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar button{background:#1e293b;border:0;color:#e2e8f0;padding:7px 12px;border-radius:8px;cursor:pointer}
.bar button.on{background:#2563eb}
.stage{flex:1;overflow:auto;padding:20px;display:flex;justify-content:center;background:#0b1120}
iframe{border:0;background:#fff;border-radius:10px;height:100%;width:680px;max-width:100%}
pre{display:none;white-space:pre-wrap;margin:0;padding:24px;background:#0b1120;color:#cbd5e1;flex:1;overflow:auto;font-size:14px;line-height:1.6}
.issues{color:#f87171;font-size:12px;margin-top:6px}
</style></head><body>
<aside><h2>Email templates</h2><button class="item"><b>Xác thực tài khoản Smart Lock</b><small>user_verification.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Đặt lại mật khẩu Smart Lock</b><small>password_reset.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Thiết bị mới đã được thêm vào tài khoản của bạn</b><small>device_added.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Bạn đã nhận được mã chia sẻ khóa</b><small>share_code_notification.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Yêu cầu kích hoạt thẻ NFC mới</b><small>admin_nfc_approval.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Thiết bị mới cần kích hoạt</b><small>admin_device_approval.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Thông báo khôi phục thiết bị</b><small>recovery_notification.html · <span class="ok">Đạt</span></small></button><button class="item"><b>Thông báo hệ thống</b><small>system_announcement.html · <span class="ok">Đạt</span></small></button></aside>
<main>
  <div class="bar"><span id="subj" style="margin-right:auto;font-weight:600"></span>
    <button id="bDesk" class="on">Máy tính</button><button id="bMob">Điện thoại</button><button id="bTxt">Text thuần</button></div>
  <div class="stage" id="stage"><iframe id="frm"></iframe></div>
  <pre id="txt"></pre>
</main>
<script>
const DATA=[{"file": "user_verification.html", "plain": "Xin chào Trần Tuấn Kiệt,\n\nCảm ơn bạn đã đăng ký tài khoản Smart Lock.\nĐể kích hoạt tài khoản, vui lòng mở liên kết sau:\n\nhttp://localhost:8000/verify-email/3f2c9d1e-8a4b-4c1f-9e2a-7d5b6c0a1f34/\n\nLiên kết có hiệu lực trong 30 phút.\nNếu bạn không thực hiện đăng ký, hãy bỏ qua email này.\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Xác thực tài khoản Smart Lock"}, {"file": "password_reset.html", "plain": "Xin chào Trần Tuấn Kiệt,\n\nChúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn.\n\nLiên kết đặt lại mật khẩu:\nhttp://localhost:8000/reset-password/ZWYyNTgwMGQtOWFmNC00NDlm/df7bca-a4048054bf2b7caa6f54f89e9b60aa51/\n\nLiên kết có hiệu lực trong 5 phút và chỉ dùng được một lần.\nNếu không phải bạn, hãy bỏ qua email này - mật khẩu vẫn được giữ nguyên.\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Đặt lại mật khẩu Smart Lock"}, {"file": "device_added.html", "plain": "Xin chào Nguyễn Văn A,\n\nQuản trị viên vừa thêm thiết bị Cửa chính - Tầng 1 (SL-ESP32-0A41) vào tài khoản của bạn.\nBạn có thể truy cập ngay để điều khiển.\n\nTruy cập: http://localhost:8000/dashboard/\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Thiết bị mới đã được thêm vào tài khoản của bạn"}, {"file": "share_code_notification.html", "plain": "Xin chào Nguyễn Văn A,\n\nChủ khóa Cửa chính - Tầng 1 đã chia sẻ khóa với bạn.\n\nMã chia sẻ (6 chữ số): 482951\n\nMã chỉ có hiệu lực trong 10 phút. Không chia sẻ mã này với người khác.\n\nTruy cập: http://localhost:8000/dashboard/\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Bạn đã nhận được mã chia sẻ khóa"}, {"file": "admin_nfc_approval.html", "plain": "Xin chào Quản trị viên,\n\nTài khoản user@example.com đã thêm thẻ NFC mới:\n- Tên thẻ: Thẻ nhân viên\n- UID: 04:A2:3B:19:7C:80\n\nThẻ chỉ hoạt động sau khi bạn xác nhận.\n\nTruy cập: http://localhost:8000/admin-sys/\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Yêu cầu kích hoạt thẻ NFC mới"}, {"file": "admin_device_approval.html", "plain": "Xin chào Quản trị viên,\n\nThiết bị SL-ESP32-0A41 của user@example.com đang chờ kích hoạt.\nVui lòng kiểm tra và kích hoạt (hoặc thông báo cho chủ thiết bị).\n\nTruy cập: http://localhost:8000/admin-sys/\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Thiết bị mới cần kích hoạt"}, {"file": "recovery_notification.html", "plain": "Xin chào Nguyễn Văn A,\n\nChủ thiết bị Cửa chính - Tầng 1 vừa gửi yêu cầu khôi phục thiết bị.\nVui lòng liên hệ quản trị viên để được hỗ trợ.\n\nTrân trọng,\nĐội ngũ Smart Lock", "subject": "Thông báo khôi phục thiết bị"}, {"file": "system_announcement.html", "plain": "Bảo trì hệ thống\n\nHệ thống sẽ bảo trì từ 23:00 đến 23:30 ngày 25/09.\n\nTrong thời gian này bạn không thể điều khiển khóa từ xa.\n\nTruy cập: http://localhost:8000\n", "subject": "Thông báo hệ thống"}];let cur=0;
const frm=document.getElementById('frm'),txt=document.getElementById('txt'),stage=document.getElementById('stage');
function show(i){cur=i;document.querySelectorAll('.item').forEach((e,k)=>e.classList.toggle('active',k===i));
 frm.src=DATA[i].file;txt.textContent=DATA[i].plain;document.getElementById('subj').textContent='Subject: '+DATA[i].subject;}
document.querySelectorAll('.item').forEach((e,k)=>e.onclick=()=>show(k));
function mode(m){stage.style.display=m==='txt'?'none':'flex';txt.style.display=m==='txt'?'block':'none';
 frm.style.width=m==='mob'?'390px':'680px';
 ['bDesk','bMob','bTxt'].forEach(id=>document.getElementById(id).classList.remove('on'));
 document.getElementById(m==='mob'?'bMob':m==='txt'?'bTxt':'bDesk').classList.add('on');}
bDesk.onclick=()=>mode('desk');bMob.onclick=()=>mode('mob');bTxt.onclick=()=>mode('txt');
show(0);
</script></body></html>
