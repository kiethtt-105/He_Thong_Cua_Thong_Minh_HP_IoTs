{% extends 'accounts/base.html' %}
{% block title %}Thông báo & Hỗ trợ{% endblock %}
{% block heading %}Thông báo & Hỗ trợ{% endblock %}
{% block subtitle %}Cập nhật hệ thống và hỗ trợ{% endblock %}

{% block content %}
<div class="notifications-page">
  <h1 class="fw-bold fs-3 mb-4">🛎️ Thông báo</h1>
  <div class="card p-4" id="notifications-list">
    <!-- JS sẽ render -->
  </div>
</div>

<style>
.notifications-page { max-width: 800px; margin: 0 auto; }
.avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; }
</style>

{% block scripts %}
<script>
async function loadNotifications() {
  const res = await fetch('/api/notifications/');
  const notifs = await res.json();

  const html = notifs.length ? notifs.map(n => `
    <div class="card p-4 mb-3">
      <div class="d-flex gap-3">
        <div class="avatar"><img src="https://picsum.photos/id/${201 + n.id % 20}/50/50" class="w-100 h-100"></div>
        <div class="flex-grow-1">
          <h5>${n.title}</h5>
          <p class="text-muted">${n.created_at ? new Date(n.created_at).toLocaleTimeString('vi-VN') : ''}</p>
          <p class="mb-0">${n.message}</p>
        </div>
      </div>
    </div>
  `).join('') : `<p class="text-muted text-center py-5">Chưa có thông báo nào</p>`;

  document.getElementById('notifications-list').innerHTML = html;
}
loadNotifications();
</script>
{% endblock %}
