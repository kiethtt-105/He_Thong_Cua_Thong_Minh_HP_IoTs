{% extends 'accounts/base.html' %}
{% block title %}Quản lý thiết bị{% endblock %}
{% block heading %}Quản lý thiết bị{% endblock %}
{% block subtitle %}Danh sách khóa cửa của bạn{% endblock %}

{% block content %}
<div class="devices-page">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold fs-3">📍 Thiết bị của tôi</h1>
    <button onclick="connectNewDevice()" class="btn btn-primary btn-lg px-4">📡 Kết nối thiết bị mới</button>
  </div>

  <div class="row g-4" id="devices-container">
    <!-- JS render -->
  </div>
</div>

<style>
.devices-page { max-width: 1200px; margin: 0 auto; }
.avatar { width: 70px; height: 70px; border-radius: 12px; overflow: hidden; }
</style>

{% block scripts %}
<script>
async function loadDevices() {
  const res = await fetch('/api/devices/');
  const devices = await res.json();

  const container = document.getElementById('devices-container');
  container.innerHTML = devices.length ? 
    devices.map(d => `
      <div class="col-md-6">
        <div class="card">
          <div class="p-4 d-flex gap-4">
            <div class="avatar"><img src="https://picsum.photos/id/${1015 + d.id % 20}/100/100" class="w-100 h-100"></div>
            <div>
              <h4>${d.name}</h4>
              <p class="text-muted small">MAC: ${d.mac_address || 'N/A'}</p>
              <span class="badge ${d.status === 'online' ? 'bg-success' : 'bg-secondary'}">${d.status}</span>
            </div>
          </div>
          <div class="p-4 d-flex gap-2">
            <button onclick="unlockDevice('${d.id}')" class="btn btn-primary flex-fill">🔓 Mở khóa</button>
            <button onclick="resetDevice('${d.id}')" class="btn btn-outline-danger flex-fill">Reset</button>
          </div>
        </div>
      </div>`).join('') : `
      <div class="col-12 text-center py-5">
        <h4 class="text-muted">Chưa có thiết bị nào</h4>
        <button onclick="connectNewDevice()" class="btn btn-primary mt-3">Kết nối thiết bị mới</button>
      </div>`;
}

async function unlockDevice(id) { alert('🔓 Mở khóa thành công!'); }
async function resetDevice(id) { alert('🔄 Reset thành công!'); }
function connectNewDevice() { alert('📡 Đang hướng dẫn pairing (full impl sau)'); }

loadDevices();
</script>
{% endblock %}
