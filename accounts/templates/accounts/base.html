<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Lock IoT{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.4s;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); }
    h1 {
      font-size: 26px;
      margin: 0 0 10px;
      color: #f8fafc;
      font-weight: 700;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 32px;
      font-weight: 500;
    }
    label {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 8px;
      margin-top: 20px;
      font-weight: 500;
    }
    input[type=text], input[type=email], input[type=password], input[type=tel] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    input:focus { 
      border-color: #38bdf8; 
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); 
    }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:hover { 
      background: #0ea5e9; 
      transform: translateY(-2px); 
    }
    .errorlist { 
      color: #f87171; 
      font-size: 13px; 
      margin: 6px 0 0; 
      padding-left: 18px; 
    }
    .msg {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 14px;
      border-left: 4px solid;
    }
    .msg.success { 
      background: rgba(34,197,94,0.15); 
      color: #4ade80; 
      border-color: #4ade80; 
    }
    .msg.error { 
      background: rgba(239,68,68,0.15); 
      color: #f87171; 
      border-color: #f87171; 
    }
    .footer-link { 
      margin-top: 26px; 
      font-size: 14px; 
      text-align: center; 
      color: #94a3b8; 
    }
    .footer-link a { 
      color: #38bdf8; 
      text-decoration: none; 
      font-weight: 500; 
    }
    .footer-link a:hover { color: #0ea5e9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{% block heading %}Smart Lock IoT{% endblock %}</h1>
    <p class="subtitle">{% block subtitle %}{% endblock %}</p>

    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
