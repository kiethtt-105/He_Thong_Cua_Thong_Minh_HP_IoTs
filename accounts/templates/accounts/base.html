<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Lock IoT{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
      color: #f8fafc;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    input[type=text], input[type=email], input[type=password] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    .errorlist { color: #f87171; font-size: 13px; margin: 4px 0 0; padding-left: 16px; }
    .msg {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .msg.success { background: rgba(34,197,94,0.15); color: #4ade80; }
    .msg.error { background: rgba(239,68,68,0.15); color: #f87171; }
    .footer-link { margin-top: 18px; font-size: 13px; text-align: center; color: #94a3b8; }
    .footer-link a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{% block heading %}Smart Lock IoT{% endblock %}</h1>
    <p class="subtitle">{% block subtitle %}{% endblock %}</p>

    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
