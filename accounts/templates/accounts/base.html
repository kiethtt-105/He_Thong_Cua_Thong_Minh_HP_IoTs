{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Lock IoT{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
    }
    body {
      background: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); }
    .nav-link {
      transition: all 0.2s;
    }
    .nav-link.active {
      background: #dbeafe;
      color: var(--primary);
      border-radius: 12px;
    }
    .status-badge {
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-badge.enabled { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .status-badge.disabled { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .action-btn {
      background: #334155;
      color: #e2e8f0;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      display: block;
      text-align: center;
    }
    .action-btn:hover {
      background: #475569;
      transform: translateY(-2px);
    }
    .danger-btn {
      background: #ef4444;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <div class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded-3 mb-4">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary fs-4" href="{% url 'accounts:dashboard' %}">🔐 Smart Lock IoT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:dashboard' %}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:devices' %}"><i class="fas fa-lock"></i> Thiết bị</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:settings' %}"><i class="fas fa-cog"></i> Cài đặt</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:logout' %}"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a></li>
          </ul>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}
  </div>

  {% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% endblock %}
</body>
</html>
