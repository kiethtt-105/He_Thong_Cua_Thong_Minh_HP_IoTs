{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Lock IoT{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; }
    body {
      background: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .app {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,0.08);
    }
    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-item {
      padding: 14px 20px;
      margin: 4px 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      color: #475569;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      text-decoration: none;
    }
    .nav-item:hover, .nav-item.active {
      background: #dbeafe;
      color: var(--primary);
      transform: scale(1.03);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
    }
    .nav-item i { font-size: 22px; width: 24px; }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-logo"><i class="fas fa-lock"></i> Smart Lock IoT</div>
      <nav>
        <a href="{% url 'accounts:dashboard' %}" class="nav-item {% if 'dashboard' in request.path|lower %}active{% endif %}"><i class="fas fa-home"></i> Dashboard</a>
        <a href="{% url 'accounts:devices' %}" class="nav-item {% if 'devices' in request.path|lower %}active{% endif %}"><i class="fas fa-lock"></i> Thiết bị</a>
        <a href="{% url 'accounts:notifications' %}" class="nav-item {% if 'notifications' in request.path|lower %}active{% endif %}"><i class="fas fa-bell"></i> Thông báo</a>
        <a href="{% url 'accounts:settings' %}" class="nav-item {% if 'settings' in request.path|lower %}active{% endif %}"><i class="fas fa-cog"></i> Cài đặt</a>
      </nav>
      <div style="margin-top:auto;padding-top:24px;border-top:1px solid #e2e8f0;">
        <a href="{% url 'accounts:logout' %}" class="nav-item text-danger"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
      </div>
    </div>
    <div class="main-content">
      {% block content %}{% endblock %}
    </div>
  </div>

  {% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% endblock %}
</body>
</html>
