<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartLock · Khoá giả lập</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--mut:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--pri:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1}.pill{padding:2px 9px;border-radius:99px;font-size:12px;background:#334155}
.pill.ok{background:#14532d;color:#86efac}.pill.err{background:#7f1d1d;color:#fca5a5}.pill.warn{background:#78350f;color:#fcd34d}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;padding:14px;max-width:1300px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
button{background:#334155;color:var(--tx);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}button:hover{filter:brightness(1.2)}
button.pri{background:var(--pri)}button.danger{background:#7f1d1d}button.sm{padding:4px 8px;font-size:12px}
input,select,textarea{width:100%;background:#0b1220;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px}label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.lock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
.bolt{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:52px;border:6px solid var(--line);transition:.4s}
.bolt.locked{border-color:var(--ok);background:#052e16}.bolt.unlocked{border-color:var(--warn);background:#422006}.bolt.jammed{border-color:var(--err);background:#450a0a}
.led{width:14px;height:14px;border-radius:50%;background:#475569;display:inline-block}.led.green{background:var(--ok)}.led.red{background:var(--err)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pad button{padding:10px}
#pinbox{font:22px ui-monospace,monospace;letter-spacing:6px;text-align:center;background:#0b1220;border-radius:8px;padding:8px;min-height:42px}
#log{height:300px;overflow:auto;background:#0b1220;border-radius:8px;padding:8px;font:12px ui-monospace,Consolas,monospace}
#log div{white-space:pre-wrap}.l-ok{color:#86efac}.l-warn{color:#fcd34d}.l-err{color:#fca5a5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv b{color:var(--mut);font-weight:500}.mono{font-family:ui-monospace,monospace;word-break:break-all}
#res{margin-top:8px;font-weight:600}.hint{color:var(--mut);font-size:12px}.hide{display:none}
</style></head><body>
<header><h1>🔐 SmartLock · Khoá giả lập (ESP32)</h1><span id="pConn" class="pill">…</span><span id="pMqtt" class="pill hide"></span><span id="pOwner" class="pill"></span></header>

<main id="setup" class="hide">
 <div class="card" style="grid-column:1/-1;max-width:640px;margin:auto">
  <h2>Chế độ cài đặt (như AP "SmartLock-Setup" của ESP32 thật)</h2>
  <label>Dán nhanh từ trang admin “Thông tin kết nối” (bôi đen cả bảng rồi dán)</label>
  <textarea id="paste" rows="5" placeholder="Server  https://....&#10;Mã thiết bị  DEV-XXXXXXXX&#10;MQTT broker  localhost : 8883 TLS&#10;Secret  ..."></textarea>
  <div class="row"><button onclick="parsePaste()">Điền tự động</button><span class="hint">hoặc nhập tay bên dưới</span></div>
  <label>Wi-Fi</label><div class="row"><select id="ssid"></select><input id="wpw" type="password" placeholder="Mật khẩu Wi-Fi"></div>
  <label>Server (không kèm /api/device)</label><input id="server" placeholder="http://127.0.0.1:8000 hoặc https://xxx.vercel.app">
  <div class="row"><div><label>Mã thiết bị</label><input id="code" placeholder="DEV-XXXXXXXX"></div><div><label>Secret</label><input id="secret"></div></div>
  <label><input type="checkbox" id="mqttOn" style="width:auto"> Dùng MQTT (tuỳ chọn, HTTP vẫn chạy song song)</label>
  <div class="row"><input id="mhost" placeholder="host" value="localhost"><input id="mport" placeholder="port" value="8883"><label style="margin:0"><input type="checkbox" id="mtls" checked style="width:auto"> TLS</label><label style="margin:0"><input type="checkbox" id="minsec" style="width:auto"> bỏ kiểm cert</label></div>
  <p><button class="pri" onclick="saveSetup()">Lưu & khởi động</button> <span id="setupMsg"></span></p>
 </div>
</main>

<main id="app" class="hide">
 <div class="card"><h2>Khoá</h2>
  <div class="lock"><div id="bolt" class="bolt">🔒</div><div><b id="lockTxt">—</b> · cửa <b id="doorTxt">—</b> <span id="led" class="led"></span></div></div>
  <div class="row" style="margin-top:8px"><button onclick="act({action:'knob'})">🔄 Núm xoay trong nhà</button><button id="bDoor" onclick="toggleDoor()">🚪 Mở cửa</button></div>
  <div class="row" style="margin-top:6px"><button class="danger" onclick="act({action:'tamper',on:true})">💥 Va đập</button><button onclick="act({action:'tamper',on:false})">Xoá cảnh báo</button></div>
  <div id="alerts" style="margin-top:8px"></div></div>

 <div class="card"><h2>Bàn phím PIN</h2><div id="pinbox"></div>
  <div class="pad"><button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button><button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button><button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button><button onclick="k('C')">⌫</button><button onclick="k('0')">0</button><button class="pri" onclick="k('OK')">OK</button></div>
  <div id="res"></div></div>

 <div class="card"><h2>Thẻ NFC · Khuôn mặt · Điện thoại</h2>
  <label>UID thẻ (hex)</label><div class="row"><input id="uid" value="04A1B2C3D4"><button onclick="act({action:'tap_card',uid:v('uid')})">Quẹt thẻ</button></div>
  <label>Khuôn mặt (embedding 128 số, JSON; để trống = ngẫu nhiên → sẽ bị từ chối)</label>
  <textarea id="face" rows="2" placeholder="[0.01, -0.02, ...]"></textarea>
  <div class="row"><button onclick="face()">Quét mặt</button><button onclick="act({action:'face',saved:true})">Dùng embedding đã lưu</button></div>
  <label>Vé điện thoại (từ app: /devices/&lt;id&gt;/ble-ticket hoặc nfc-ticket)</label>
  <textarea id="ticket" rows="2" placeholder="userhex.exp.sig"></textarea>
  <div class="row"><button onclick="act({action:'phone',kind:'ble',ticket:v('ticket')})">Bluetooth</button><button onclick="act({action:'phone',kind:'nfc',ticket:v('ticket')})">NFC điện thoại</button></div></div>

 <div class="card"><h2>Phần cứng & mạng</h2>
  <div class="kv"><b>Pin</b><span><input type="range" id="bat" min="0" max="100" oninput="act({action:'battery',value:this.value})"> <span id="batT"></span></span>
  <b>RSSI</b><span><input type="range" id="sig" min="-100" max="-30" oninput="act({action:'signal',value:this.value})"> <span id="sigT"></span></span></div>
  <div class="row" style="margin-top:8px"><button id="bWifi" onclick="toggleWifi()">📶 Wi-Fi</button><button onclick="act({action:'jam',on:!jam});jam=!jam">🪤 Kẹt chốt</button><button onclick="act({action:'check_ota'})">⬆ OTA</button></div>
  <div class="row" style="margin-top:6px"><button onclick="act({action:'heartbeat'})">♥ Heartbeat ngay</button><button onclick="act({action:'reboot'})">↻ Reboot</button><button class="danger" onclick="if(confirm('Xoá toàn bộ cấu hình?'))act({action:'factory_reset'})">Factory reset</button></div></div>

 <div class="card"><h2>Kết nối</h2><div class="kv" id="kv"></div>
  <label>Đổi server (thử local ↔ vercel ↔ tunnel)</label>
  <div class="row"><select id="srvSel"></select><button onclick="switchSrv()">Dùng</button></div>
  <div class="row" style="margin-top:6px"><input id="newName" placeholder="tên (vercel)"><input id="newUrl" placeholder="https://xxx.vercel.app"><button onclick="addSrv()">Thêm</button></div></div>

 <div class="card" style="grid-column:1/-1"><h2>Nhật ký (serial monitor)</h2><div id="log"></div></div>
</main>

<script>
const $=id=>document.getElementById(id),v=id=>$(id).value;let st=null,seq=0,pin='',jam=false,wasConf=null;
async function api(p,b){const r=await fetch(p,b?{method:'POST',body:JSON.stringify(b)}:{});return r.json()}
async function act(b){const r=await api('/api/action',b);if(r&&r.method)showRes(r);return r}
function showRes(r){const e=$('res');e.textContent=(r.granted?'✅ ':'⛔ ')+r.method+(r.reason?' · '+r.reason:' · CHO PHÉP');e.style.color=r.granted?'var(--ok)':'var(--err)'}
function k(x){if(x==='C')pin=pin.slice(0,-1);else if(x==='OK'){act({action:'pin',pin});pin=''}else if(pin.length<8)pin+=x;$('pinbox').textContent='•'.repeat(pin.length)}
function toggleDoor(){act({action:'door',open:!st.door_open})}function toggleWifi(){act({action:'wifi',up:!st.wifi.up})}
function face(){let t=v('face').trim();if(!t)return act({action:'face'});try{act({action:'face',vector:JSON.parse(t)})}catch(e){alert('JSON không hợp lệ')}}
function switchSrv(){act({action:'switch_server',name:v('srvSel')})}
function addSrv(){if(v('newName')&&v('newUrl'))act({action:'switch_server',name:v('newName'),url:v('newUrl')})}
function parsePaste(){const t=v('paste');const g=(re)=>(t.match(re)||[])[1]||'';
 let s=g(/^\s*Server\s+(https?:\/\/\S+)/mi)||g(/(https?:\/\/\S+)/);$('server').value=s.replace(/\/api\/device\/?$/,'');
 $('code').value=g(/(DEV-[A-Z0-9_-]+)/i).toUpperCase();$('secret').value=g(/Secret\s+(\S+)/i);
 const m=t.match(/MQTT[^\n]*?\n?\s*([\w.\-]+)\s*:\s*(\d+)/i);if(m){$('mhost').value=m[1];$('mport').value=m[2];$('mtls').checked=/TLS/i.test(t)||m[2]=='8883'}}
async function saveSetup(){const r=await api('/api/setup',{ssid:v('ssid'),password:v('wpw'),server:v('server'),device_code:v('code'),secret:v('secret'),
 mqtt:{enabled:$('mqttOn').checked,host:v('mhost'),port:v('mport'),tls:$('mtls').checked,tls_insecure:$('minsec').checked}});
 $('setupMsg').textContent=r.message;$('setupMsg').style.color=r.ok?'var(--ok)':'var(--err)'}
async function loadWifi(){const l=await api('/api/wifi-scan');$('ssid').innerHTML=l.map(w=>`<option>${w.ssid}</option>`).join('')+'<option>(mạng ẩn - gõ tên ở ô mật khẩu không hỗ trợ)</option>'}
const LOCK={locked:['🔒','ĐÃ KHOÁ'],unlocked:['🔓','ĐANG MỞ'],jammed:['⚠️','KẸT CHỐT']};
function render(s){st=s;
 if(wasConf!==s.configured){wasConf=s.configured;$('setup').classList.toggle('hide',s.configured);$('app').classList.toggle('hide',!s.configured);if(!s.configured)loadWifi();if(s.configured)seq=0,$('log').innerHTML=''}
 if(!s.configured)return;
 const c=$('pConn');let t='Offline',cl='err';if(s.auth_failed){t='Sai secret';cl='err'}else if(s.online){t='Online';cl='ok'}else if(!s.wifi.up){t='Wi-Fi tắt';cl='warn'}c.textContent='● '+t+' · '+s.device_code;c.className='pill '+cl;
 const m=$('pMqtt');m.classList.toggle('hide',!s.mqtt.enabled);m.textContent='MQTT '+(s.mqtt.connected?'✔':'✖');m.className='pill '+(s.mqtt.connected?'ok':'warn');
 const o=$('pOwner'),sc=s.server_cfg;o.textContent=sc.has_owner?'Đã gán chủ':(s.online?'Chờ gán chủ':'—');o.className='pill '+(sc.has_owner?'ok':'warn');
 $('bolt').className='bolt '+s.lock_state;$('bolt').textContent=LOCK[s.lock_state][0];$('lockTxt').textContent=LOCK[s.lock_state][1];
 $('doorTxt').textContent=s.door_open?'MỞ':'đóng';$('bDoor').textContent=s.door_open?'🚪 Đóng cửa':'🚪 Mở cửa';$('led').className='led '+(s.led==='green'?'green':s.led==='red'?'red':'');
 $('alerts').innerHTML=(s.tamper?'<span class="pill err">⚠ TAMPER</span> ':'')+(s.locked_out?'<span class="pill err">🚫 BỊ KHOÁ TẠM (nhập sai nhiều lần)</span> ':'')+(s.battery<=15?'<span class="pill warn">🔋 Pin yếu</span>':'');
 if(document.activeElement!==$('bat'))$('bat').value=s.battery;$('batT').textContent=s.battery+'%';if(document.activeElement!==$('sig'))$('sig').value=s.signal;$('sigT').textContent=s.signal+' dBm';
 $('bWifi').textContent='📶 Wi-Fi: '+(s.wifi.up?'BẬT':'TẮT');
 const fl=x=>x===false?'tắt':'bật';
 $('kv').innerHTML=`<b>Server</b><span class=mono>${s.server.override||s.server.urls[s.server.active]||''}</span><b>Wi-Fi</b><span>${s.wifi.ssid}</span><b>MAC</b><span class=mono>${s.mac}</span><b>Firmware</b><span>${s.firmware}${sc.ota&&sc.ota.available?' → '+sc.ota.version+' có sẵn':''}</span><b>Trạng thái server</b><span>${sc.status||'—'}</span><b>Wi-Fi/BLE/NFC</b><span>${fl(sc.wifi_enabled)} / ${fl(sc.bluetooth_enabled)} / ${fl(sc.nfc_enabled)}</span><b>Heartbeat cuối</b><span>${s.last_hb_ago==null?'—':s.last_hb_ago+'s trước'}</span><b>Hàng đợi offline</b><span>${(s.queue.events||0)} sự kiện, ${(s.queue.phone||0)} vé ĐT</span><b>MQTT</b><span>${s.mqtt.enabled?(s.mqtt.host+':'+s.mqtt.port+(s.mqtt.connected?' ✔':' ✖ '+s.mqtt.error)):'tắt (dùng HTTP)'}</span>${s.last_error?'<b>Lỗi</b><span style="color:var(--err)">'+s.last_error+'</span>':''}`;
 const sel=$('srvSel');const keys=Object.keys(s.server.urls);if(sel.dataset.k!==keys.join()+s.server.active){sel.dataset.k=keys.join()+s.server.active;sel.innerHTML=keys.map(n=>`<option ${n===s.server.active?'selected':''}>${n}</option>`).join('')}
 const lg=$('log');for(const l of s.logs){if(l.id<=seq)continue;seq=l.id;const d=document.createElement('div');d.className='l-'+l.lvl;d.textContent=l.t+'  '+l.m;lg.appendChild(d)}lg.scrollTop=lg.scrollHeight}
async function tick(){try{render(await api('/api/state?since='+seq))}catch(e){}setTimeout(tick,1000)}tick();
</script></body></html>
