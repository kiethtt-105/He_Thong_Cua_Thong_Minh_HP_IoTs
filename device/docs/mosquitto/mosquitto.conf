# Mẫu cấu hình Mosquitto cho SmartLock (dev tunnel VS Code)
#   - 1883 : MQTT thường, CHỈ nghe 127.0.0.1  -> Django (cùng máy) publish lệnh
#   - 9001 : MQTT over WebSocket, nghe 127.0.0.1 -> forward cổng này bằng dev tunnel (Public) cho khoá nối vào qua wss://
# TLS do dev tunnel lo (https/wss) nên listener 9001 không cần chứng chỉ.
per_listener_settings true

listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file ./passwd
acl_file ./acl

listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file ./passwd
acl_file ./acl
